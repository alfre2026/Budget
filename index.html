      testo: "I soldi escono dal conto e la busta si svuota di quella cifra.",
      corpo: P.campo("imp", "Quanto hai pagato", M.accBusta(s, b.id, c.oggi), "number") +
        P.campo("data", "Quando", M.iso(c.oggi), "date"),
      ok: "Registra il pagamento", az: "fai:paga-busta", dato: dato };
  },
  "dist": function (c, s) {
    return { tit: "Riporta nel budget",
      testo: "I soldi restano in banca: cambia solo l'etichetta. Il saldo previsto non si muove, il budget del mese sale.",
      corpo: P.campo("imp", "Quanto", "", "number"), ok: "Riporta", az: "fai:dist" };
  },
  "corr-salv": function (c, s) {
    return { tit: "Correggi il salvadanaio",
      testo: "Scrivi quanto c'\u00e8 davvero. Se l'app ne conta pi\u00f9 di quelli che hai messo via, il budget si libera della differenza.",
      corpo: P.campo("vero", "Quanto c'\u00e8 davvero", M.c2(App.c.fantasma - App.c.fantasmaDett.quote), "number"),
      ok: "Correggi", az: "fai:corr-salv" };
  },
  "importa": function () {
    return { tit: "Carica un registro",
      testo: "Incolla il contenuto di un file scaricato. Gli eventi si aggiungono ai tuoi, non li sostituiscono.",
      corpo: '<textarea name="json" rows="6" placeholder="{...}"></textarea>', ok: "Carica", az: "fai:importa" };
  }
};

/* ════════════════════════════════════════════════════════════
   BLOCCO AZIONI
   Un solo punto in cui il registro cambia: agisci(). Salva,
   sincronizza e ridisegna.
   ════════════════════════════════════════════════════════════ */
function num(v) { return M.c2(String(v == null ? "" : v).replace(",", ".")); }

var AZIONI = {
  "cat": function (v, dato) { App.cat = dato; disegna(); },
  "periodo": function (v) { App.pDa = v.pda || App.pDa; App.pA = v.pa || App.pA; disegna(); },
  "scorc": function (v, dato) { var p = dato.split("|"); App.pDa = p[0]; App.pA = p[1]; disegna(); },

  "spesa-veloce": function (v) {
    var i = num(v.imp); if (!i) return;
    agisci(function (s) { M.registraSpesa(s, { imp: i, cat: App.cat, nota: v.nota || "", d: M.iso(App.c.oggi) }); });
  },
  "movimento": function (v) {
    var i = num(v.imp); if (!i) return;
    var t = v.tipo || "spesa";
    agisci(function (s) {
      if (t === "entrata") M.registraEntrata(s, i, v.nota || "", v.data);
      else if (t.indexOf("fissa:") === 0) M.registraSpesa(s, { imp: i, fissaId: t.slice(6), nota: v.nota || "", d: v.data });
      else M.registraSpesa(s, { imp: i, cat: App.cat, nota: v.nota || "", fonte: v.fonte || "budget", d: v.data });
    });
  },
  "lettura": function (v) {
    if (!v.saldo) return;
    agisci(function (s) { M.leggiSaldo(s, num(v.saldo), v.data || M.iso(App.c.oggi)); });
  },
  "cancella": function (v, dato) {
    App.fin = { tit: "Cancellare il movimento?", testo: "I conti si ricalcolano da soli.",
      corpo: "", ok: "Cancella", az: "fai:cancella", dato: dato, pericolo: true };
    disegnaFin();
  },
  "fai:cancella": function (v, dato) {
    agisci(function (s) {
      s.ev = s.ev.filter(function (e) { return e.id !== dato; });
      s.del = (s.del || []).concat([dato]);
    });
  },
  "impostazioni": function (v) {
    agisci(function (s) {
      s.imp.stip = num(v.stip);
      s.imp.durata = parseInt(v.durata, 10) || 31;
      s.imp.tassa = num(v.tassa);
    });
  },

  /* --- le cinque risposte --- */
  "fai:paga": function (v) {
    agisci(function (s) {
      var vecchia = null;
      M.ordina(s.ev).forEach(function (e) { if (e.t === "paga") vecchia = e; });
      if (vecchia) { s.ev = s.ev.filter(function (e) { return e.id !== vecchia.id; }); s.del = (s.del || []).concat([vecchia.id]); }
      M.registraPaga(s, num(v.imp), v.data);
      s.imp.stip = num(v.imp);
    });
  },
  "fai:apertura": function (v) {
    if (!v.saldo) return;
    agisci(function (s) { M.leggiSaldo(s, num(v.saldo), v.data); });
  },
  "fai:fondo": function (v) {
    agisci(function (s) { M.fissaFondoCassa(s, num(v.fc), v.motivo || "", M.iso(App.c.oggi)); });
  },
  "fai:prossima": function (v) {
    agisci(function (s) { s.imp.prevista = v.prevista || null; });
  },

  /* --- lo scarto --- */
  "scarto:spesa": function () { agisci(function (s) { M.chiudiScarto(s, App.c.scarto, "spesa"); }); },
  "scarto:entrata": function () { agisci(function (s) { M.chiudiScarto(s, App.c.scarto, "entrata"); }); },
  "scarto:fondo": function () {
    agisci(function (s) { M.fissaFondoCassa(s, M.c2(App.c.fondo + App.c.scarto), "differenza dell'estratto conto", M.iso(App.c.oggi)); });
  },

  /* --- piano --- */
  "fai:chiudi-fissa": function (v, dato) { agisci(function (s) { M.chiudiFissa(s, dato, num(v.imp), v.data); }); },
  "fai:nuova-fissa": function (v) {
    if (!v.nome) return;
    agisci(function (s) {
      s.fisse = s.fisse.concat([{ id: M.id(), nome: v.nome, icona: "\u25CF", prev: num(v.prev),
        blind: v.blind === "1", gg: parseInt(v.gg, 10) || null }]);
    });
  },
  "fai:nuova-busta": function (v) {
    if (!v.nome) return;
    var nid = M.id();
    agisci(function (s) {
      s.buste = s.buste.concat([{ id: nid, nome: v.nome, icona: "\u25CF", obiettivo: num(v.obiettivo),
        scad: v.scad ? M.ts(v.scad) : null, ric: 12, tipo: v.scad ? "scadenza" : "continua", attiva: true }]);
      if (num(v.acc)) M.ev(s, { t: "accIni", bustaId: nid, imp: num(v.acc), d: M.iso(App.c.oggi) });
    });
  },
  "fai:busta": function (v, dato) {
    agisci(function (s) {
      s.buste.forEach(function (b) {
        if (b.id !== dato) return;
        b.obiettivo = num(v.obiettivo);
        b.scad = v.scad ? M.ts(v.scad) : null;
        b.tipo = b.scad ? "scadenza" : "continua";
      });
      if (v.vero !== "" && v.vero != null) {
        var gia = M.accBusta(s, dato, App.c.oggi);
        var delta = M.c2(num(v.vero) - gia);
        if (Math.abs(delta) > 0.004) M.correggiFantasma(s, "busta:" + dato, delta, M.iso(App.c.oggi));
      }
      if (num(v.versa)) M.versaInBusta(s, dato, num(v.versa), M.iso(App.c.oggi));
    });
  },
  "fai:paga-busta": function (v, dato) {
    agisci(function (s) {
      M.registraSpesa(s, { imp: num(v.imp), fonte: "busta:" + dato, d: v.data, nota: "pagata dalla busta" });
    });
  },
  "fai:dist": function (v) { agisci(function (s) { M.distribuisci(s, num(v.imp), M.iso(App.c.oggi)); }); },
  "fai:corr-salv": function (v) {
    agisci(function (s) {
      var gia = M.c2(App.c.fantasma - App.c.fantasmaDett.quote);
      var delta = M.c2(num(v.vero) - gia);
      if (Math.abs(delta) > 0.004) M.correggiFantasma(s, "salv", delta, M.iso(App.c.oggi));
    });
  },
  "fai:importa": function (v) {
    var r; try { r = JSON.parse(v.json); } catch (e) { return avvisa("Non l'ho capito", "Il testo non \u00e8 un registro valido."); }
    agisci(function (s) {
      var f = SINCRO.unisci(s, r.v === 4 ? r : M.migra(r));
      s.ev = f.ev; s.del = f.del; s.fisse = f.fisse; s.buste = f.buste; s.imp = f.imp;
    });
  },

  "esporta": function () { ARCHIVIO.esporta(App.store); },
  "sincro-collega": function (v) { SINCRO.config(v.key || "", v.binid || ""); AZIONI["sincro-ora"](); },
  "sincro-crea": function (v) {
    SINCRO.config(v.key || "", null);
    SINCRO.crea(App.store, function (id) {
      avvisa(id ? "Contenitore creato" : "Non ci sono riuscito",
        id ? "Id: " + id + "\n\nSull'altro telefono incolla la stessa master key e questo id."
           : "Controlla la master key.");
    });
  },
  "sincro-ora": function () {
    SINCRO.scrivi(App.store, function (fuso, esito) {
      App.sync = esito;
      if (fuso && esito === "ok") { App.store = fuso; ARCHIVIO.salva(App.store); }
      disegna();
      if (esito === "chiave") avvisa("Non raggiungibile", "La master key o l'id non vanno pi\u00f9 bene.");
    });
  },
  "sincro-stacca": function () { SINCRO.stacca(); App.sync = "off"; disegna(); },

  "avvio:vecchio": function () {
    var t = ARCHIVIO.trovaVecchio();
    App.store = M.migra(t.store);
    App.primo = false; ARCHIVIO.salva(App.store); App.tab = "oggi"; disegna();
  },
  "avvio:pulito": function () {
    App.store = M.nuovoStore(); App.store.imp.durata = 31;
    App.primo = false; ARCHIVIO.salva(App.store); App.tab = "oggi"; disegna();
  }
};

/* ════════════════════════════════════════════════════════════
   BLOCCO IMPALCATURA
   ════════════════════════════════════════════════════════════ */
var App = { store: null, tab: "oggi", sync: "off", fin: null, c: null,
            primo: false, cat: "Alimentari", pDa: "", pA: "" };

function agisci(fn) {
  fn(App.store);
  App.store.mod = Date.now();
  ARCHIVIO.salva(App.store);
  App.fin = null;
  disegna();
  if (SINCRO.bin()) {
    clearTimeout(agisci._t);
    agisci._t = setTimeout(function () {
      SINCRO.scrivi(App.store, function (fuso, esito) {
        App.sync = esito;
        if (fuso && esito === "ok" && fuso.ev.length !== App.store.ev.length) {
          App.store = fuso; ARCHIVIO.salva(App.store); disegna();
        }
      });
    }, 1400);
  }
}
function avvisa(tit, testo) { App.fin = { tit: tit, testo: testo, corpo: "", ok: null }; disegnaFin(); }

function valori() {
  var o = {};
  document.querySelectorAll("#app input,#app select,#app textarea,#fin input,#fin select,#fin textarea")
    .forEach(function (i) { if (i.name) o[i.name] = i.value; });
  return o;
}

var PAGINE = [["oggi", "Oggi", "\u25CF"], ["spese", "Spese", "\u2212"], ["piano", "Piano", "\u2261"],
              ["conto", "Conto", "\u25A4"], ["altro", "Altro", "\u22EF"]];

function pagPrimo() {
  var v = ARCHIVIO.trovaVecchio();
  var h = P.carta(null,
    '<div class="eyebrow">Registro di casa</div>' +
    '<div style="font-family:var(--serif);font-size:25px;margin-top:5px">Da dove partiamo?</div>');
  if (v) {
    h += P.carta("Porta dentro il registro vecchio",
      '<div class="serif">Ci sono ' + v.store.ev.length + " movimenti salvati sotto <b>" + P.esc(v.chiave) +
      "</b>. Li porto tutti, e le vecchie rettifiche diventano eventi espliciti. Il registro vecchio resta dov'\u00e8.</div>" +
      P.btn("Porta dentro i " + v.store.ev.length + " movimenti", "avvio:vecchio"), "acc");
  }
  h += P.carta("Riparti pulito",
    '<div class="serif">Registro vuoto. Rispondi alle cinque domande e l\'app sa gi\u00e0 tutto quello che le serve.</div>' +
    P.btn("Riparti pulito", "avvio:pulito", { cls: v ? "vuoto" : "" }), v ? "" : "acc");
  return h;
}

function disegna() {
  if (App.primo) {
    document.getElementById("app").innerHTML = pagPrimo();
    document.getElementById("nav").innerHTML = "";
    disegnaFin();
    return;
  }
  App.c = M.conti(App.store, M.oggiTs());
  var c = App.c, s = App.store;
  var testata = '<div class="testata"><div><h1>Registro di casa</h1>' +
    '<div class="v">v' + P.esc(VERSIONE) + "</div></div>" +
    '<div class="dx">' + P.esc(M.lblLungo(c.oggi)) +
    (c.ciclo ? "<br>giorno " + (M.giorniTra(c.ciclo.ini, c.oggi) + 1) + " \u00b7 " +
      c.giorniAttesa + " alla paga" : "") + "</div></div>";
  var h = App.tab === "oggi" ? pagOggi(c, s)
    : App.tab === "spese" ? pagSpese(c, s)
    : App.tab === "piano" ? pagPiano(c, s)
    : App.tab === "conto" ? pagConto(c, s)
    : pagAltro(c, s);
  document.getElementById("app").innerHTML = testata + h;
  document.getElementById("nav").innerHTML = PAGINE.map(function (p) {
    return '<button data-tab="' + p[0] + '" class="' + (App.tab === p[0] ? "on" : "") + '">' +
      "<b>" + p[2] + "</b>" + p[1] + "</button>";
  }).join("");
  disegnaFin();
}

function disegnaFin() {
  var f = App.fin, el = document.getElementById("fin");
  if (!f) { el.innerHTML = ""; return; }
  el.innerHTML = '<div class="velo" data-chiudi="1"><div class="fin">' +
    "<h3>" + P.esc(f.tit) + "</h3>" +
    (f.testo ? "<p>" + P.esc(f.testo) + "</p>" : "") + (f.corpo || "") +
    (f.ok ? P.btn(f.ok, f.az, { dato: f.dato, cls: f.pericolo ? "rossa" : "" }) : "") +
    P.btn(f.ok ? "Lascia stare" : "Va bene", "chiudi", { cls: "vuoto" }) + "</div></div>";
}

document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-tab]");
  if (t) { App.tab = t.getAttribute("data-tab"); App.fin = null; disegna(); return; }
  if (ev.target.getAttribute && ev.target.getAttribute("data-chiudi")) { App.fin = null; disegnaFin(); return; }
  var b = ev.target.closest("button[data-az]");
  if (!b) return;
  var az = b.getAttribute("data-az"), dato = b.getAttribute("data-dato");
  if (az === "chiudi") { App.fin = null; disegnaFin(); return; }
  if (az.indexOf("dom:") === 0 || az.indexOf("dlg:") === 0) {
    var g = FINESTRE[az.slice(4)];
    if (g) { App.fin = g(App.c, App.store, dato); disegnaFin(); }
    return;
  }
  var fn = AZIONI[az];
  if (fn) fn(valori(), dato);
});
document.addEventListener("change", function (ev) {
  var i = ev.target;
  if (i.getAttribute && i.getAttribute("data-az") === "periodo") AZIONI["periodo"](valori());
});

(function () {
  App.store = ARCHIVIO.carica();
  if (!App.store) { App.primo = true; App.store = M.nuovoStore(); }
  if (!App.store.del) App.store.del = [];
  if (!App.store.imp.durata) App.store.imp.durata = 31;
  disegna();
  if (!App.primo && SINCRO.bin()) {
    SINCRO.leggi(function (r, esito) {
      App.sync = esito;
      if (r && r.ev) { App.store = SINCRO.unisci(App.store, r); ARCHIVIO.salva(App.store); }
      disegna();
    });
  }
})();

</script>
</body>
</html>
