<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Registro di casa</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#EDEFEA;color:#16202B;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  #root{max-width:480px;margin:0 auto;padding:0 14px;
    padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible{
    outline:2px solid #2C5A8A;outline-offset:2px}
  input,select{-webkit-appearance:none;appearance:none;font-family:inherit}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=date]{min-height:44px}
  ::selection{background:#16202B;color:#fff}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ============================================================

  var GG = ["domenica","luned\u00EC","marted\u00EC","mercoled\u00EC","gioved\u00EC","venerd\u00EC","sabato"];

    e.ts = e.ts || Date.now();
    e.d = e.d || iso(oggiTs());
    store.ev = store.ev.concat([e]);
    return e;
  }
  function togliEv(store, evId) {
    store.ev = store.ev.filter(function (x) { return x.id !== evId; });
    if (store.del.indexOf(evId) < 0) store.del = store.del.concat([evId]).slice(-500);
  }

  /* ============================================================
     CICLI — dal registro delle paghe
     ============================================================ */
  // Due paghe a pochi giorni di distanza sono quasi sempre lo stesso stipendio registrato
  // due volte (due telefoni che si sincronizzano, o un tocco di troppo). Se le contassi
  // entrambe raddoppierei ciclo, quote e saldo atteso: tengo la prima e segnalo la seconda.
  function pagheDoppie(store) {
    var p = store.ev.filter(function (e) { return e.t === "paga"; })
      .sort(function (a, b) { return ts(a.d) - ts(b.d); });
    var buone = [], scartate = [];
    for (var i = 0; i < p.length; i++) {
      var ultima = buone.length ? buone[buone.length - 1] : null;
      if (ultima && giorniTra(ts(ultima.d), ts(p[i].d)) < 20) scartate.push(p[i]);
      else buone.push(p[i]);
    }
    return { buone: buone, scartate: scartate };
  }
  function cicli(store, oggi) {
    var paghe = pagheDoppie(store).buone;
    var dur = store.imp.durata || 31;
    var out = [];
    for (var i = 0; i < paghe.length; i++) {
      var ini = ts(paghe[i].d);
      var finNat = piuGiorni(ini, dur - 1);
      var fin = (i + 1 < paghe.length) ? piuGiorni(ts(paghe[i + 1].d), -1) : finNat;
      out.push({ n: i + 1, ini: ini, fin: fin, finNat: finNat, stip: paghe[i].imp, evId: paghe[i].id });
    }
    return out;
  }

  /* ============================================================
     LE VOCI FISSE DEL CICLO
     Regola d'oro: una fissa pesa sul budget SEMPRE almeno il previsto.
     ============================================================ */
  function statoFisse(store, ciclo, oggi) {
    var righe = store.fisse.map(function (f) {
      var usciteEv = store.ev.filter(function (e) {
        return e.t === "fissa" && e.fissaId === f.id && ts(e.d) >= ciclo.ini && ts(e.d) <= ciclo.fin;
      });
      var acconti = store.ev.filter(function (e) {
        return e.t === "spesa" && e.fissaId === f.id && ts(e.d) >= ciclo.ini && ts(e.d) <= ciclo.fin;
      });
      var uscito = usciteEv.reduce(function (a, x) { return a + x.imp; }, 0)
        + acconti.reduce(function (a, x) { return a + x.imp; }, 0);
      var chiusa = usciteEv.length > 0;                 // bolletta/addebito confermato a mano
      var scad = null;
      if (f.gg >= 1 && f.gg <= 31) {
        var d0 = new Date(ciclo.ini);
        var cand = new Date(d0.getFullYear(), d0.getMonth(), f.gg);
        if (cand.getTime() < ciclo.ini) cand = new Date(d0.getFullYear(), d0.getMonth() + 1, f.gg);
        cand.setHours(0, 0, 0, 0);
        scad = cand.getTime();
      }
      var scaduta = scad != null && scad <= oggi;
      // Addebito automatico: se la voce ha una data di addebito e quel giorno e' passato,
      // i soldi sono gia' usciti dal conto anche senza conferma a mano. Contarli ancora
      // come "da pagare" farebbe leggere all'app un saldo piu' alto di quello vero.
      var autoUscita = !chiusa && !!f.blind && scaduta;
      var pesa = Math.max(f.prev, uscito);              // regola d'oro
      var risparmio = chiusa ? Math.max(0, f.prev - uscito) : 0;
      var sforo = Math.max(0, uscito - f.prev);
      var restaDaUscire = (chiusa || autoUscita) ? 0 : Math.max(0, f.prev - uscito);
      var uscitaEffettiva = chiusa ? uscito : (autoUscita ? f.prev : uscito);
      return {
        f: f, uscito: c2(uscito), chiusa: chiusa, pesa: c2(pesa), risparmio: c2(risparmio),
        sforo: c2(sforo), restaDaUscire: c2(restaDaUscire), scad: scad,
        scaduta: scaduta, autoUscita: autoUscita, fuori: chiusa || autoUscita,
        uscitaEffettiva: c2(uscitaEffettiva), nAcconti: acconti.length
      };
    });
    return righe;
  }

  /* ============================================================
     BUSTE — quota del mese, ricalcolata sul residuo
     ============================================================ */
  function quotaBusta(b, rifTs) {
    if (!b.attiva) return 0;
    if (!b.scad) return b.quota || 0;                 // fondo continuo
    var manca = Math.max(0, (b.obiettivo || 0) - Math.max(0, b.acc || 0));
    var mesi = 0, d = new Date(rifTs);
    while (d.getTime() < b.scad && mesi < 120) { mesi++; d.setMonth(d.getMonth() + 1); }
    return c2(manca / Math.max(1, mesi));
  }

  // Movimenti diretti sulle buste (fuori dalle quote automatiche), con la loro data.
  function movBuste(store) {
    var out = [];
    store.ev.forEach(function (e) {
      if (e.t === "accIni" || e.t === "versaExtra") out.push({ b: e.bustaId, imp: e.imp, t: ts(e.d) });
      if (e.t === "spesa" && e.fonte && e.fonte.indexOf("busta:") === 0)
        out.push({ b: e.fonte.slice(6), imp: -e.imp, t: ts(e.d) });
      // "quei soldi non c'erano davvero": la lettura del conto smentisce l'accantonamento
      if (e.t === "rett" && e.causa === "buste" && e.bustaId) out.push({ b: e.bustaId, imp: e.imp, t: ts(e.d) });
    });
    return out;
  }
  // Scadenza corrente di una busta: quella base, spostata dai rinnovi registrati.
  function scadBusta(store, b) {
    var sc = b.scad || null;
    store.ev.filter(function (e) { return e.t === "rinnova" && e.bustaId === b.id; })
      .sort(function (a, c) { return a.ts - c.ts; })
      .forEach(function (e) { sc = e.scad; });
    return sc;
  }
  // Quote ciclo per ciclo: ogni quota si calcola sull'accantonato che c'era all'APERTURA
  // di quel ciclo, cosi' resta stabile per tutto il mese e non si muove sotto i piedi.
  function pianoQuote(store, lista, oggi) {
    var mov = movBuste(store);
    var quote = [], accFin = {};
    var accBase = {};
    store.buste.forEach(function (b) { accBase[b.id] = 0; accFin[b.id] = 0; });
    var cumQuote = {};
    store.buste.forEach(function (b) { cumQuote[b.id] = 0; });
    for (var i = 0; i < lista.length; i++) {
      var c = lista[i], q = {};
      store.buste.forEach(function (b) {
        var movPrima = mov.filter(function (m) { return m.b === b.id && m.t < c.ini; })
          .reduce(function (a, m) { return a + m.imp; }, 0);
        var accAp = c2(cumQuote[b.id] + movPrima);
        var bb = { attiva: b.attiva, scad: scadBusta(store, b), obiettivo: b.obiettivo, quota: b.quota, acc: accAp };
        q[b.id] = (c.ini <= oggi) ? quotaBusta(bb, c.ini) : 0;
        cumQuote[b.id] = c2(cumQuote[b.id] + q[b.id]);
      });
      quote.push(q);
    }
    store.buste.forEach(function (b) {
      var movTot = mov.filter(function (m) { return m.b === b.id; }).reduce(function (a, m) { return a + m.imp; }, 0);
      accFin[b.id] = c2(cumQuote[b.id] + movTot);
    });
    return { quote: quote, acc: accFin };
  }

  /* ============================================================
     SIMULAZIONE DI UN CICLO, GIORNO PER GIORNO
     La tassa di risparmio NON e' uno stato salvato: e' il risultato
     della cronologia. Se aggiungi una spesa di ieri, tutto si ricalcola.
     ============================================================ */
  function simula(store, ciclo, oggi, quotePer) {
    var imp = store.imp;
    var fisse = statoFisse(store, ciclo, oggi);
    var fissePesano = fisse.reduce(function (a, r) { return a + r.pesa; }, 0);
    quotePer = quotePer || {};
    var quote = 0;
    store.buste.forEach(function (b) { quote += (quotePer[b.id] || 0); });

    var disponibile = c2(ciclo.stip - fissePesano - quote);

    // spese variabili del ciclo (fonte budget), per giorno
    var perGiorno = {};
    var speseCiclo = store.ev.filter(function (e) {
      if (e.t !== "spesa") return false;
      var t = ts(e.d);
      return t >= ciclo.ini && t <= ciclo.fin && !e.fissaId && (!e.fonte || e.fonte === "budget");
    });
    speseCiclo.forEach(function (e) { var k = ts(e.d); perGiorno[k] = (perGiorno[k] || 0) + e.imp; });

    // restituzioni dal salvadanaio al budget
    var distPerGiorno = {};
    store.ev.forEach(function (e) {
      if (e.t !== "dist") return;
      var t = ts(e.d);
      if (t >= ciclo.ini && t <= ciclo.fin) distPerGiorno[t] = (distPerGiorno[t] || 0) + e.imp;
    });
    // rettifiche che entrano nel budget (soldi trovati / spese sfuggite gia' registrate a parte)
    var rettPerGiorno = {};
    store.ev.forEach(function (e) {
      if (e.t !== "rett" || e.causa !== "budget") return;
      var t = ts(e.d);
      if (t >= ciclo.ini && t <= ciclo.fin) rettPerGiorno[t] = (rettPerGiorno[t] || 0) + e.imp;
    });

    var giorniTot = giorniTra(ciclo.ini, ciclo.fin) + 1;
    var ultimo = Math.min(oggi, ciclo.fin);
    var giorni = [];
    var speso = 0, tassaTot = 0, dist = 0, rett = 0;
    var serie = 0, serieMax = 0, giorniOk = 0, giorniPersi = 0;

    for (var t0 = ciclo.ini; t0 <= ultimo; t0 = piuGiorni(t0, 1)) {
      var idx = giorniTra(ciclo.ini, t0);          // 0-based
      var rimasti = giorniTot - idx;               // oggi compreso
      var base = c2(disponibile - speso - tassaTot + dist + rett);
      var budgetG = rimasti > 0 ? base / rimasti : base;
      var spesoG = c2(perGiorno[t0] || 0);
      var distG = c2(distPerGiorno[t0] || 0);
      var rettG = c2(rettPerGiorno[t0] || 0);
      dist += distG; rett += rettG;
      // la restituzione del giorno alza il budget dello stesso giorno
      base = c2(base + distG + rettG);
      budgetG = rimasti > 0 ? base / rimasti : base;
      var resta = c2(budgetG - spesoG);
      var tassaG = 0;
      var chiuso = t0 < oggi;
      if (chiuso && imp.tassa > 0) {
        tassaG = Math.max(0, Math.min(imp.tassa, resta));
        tassaG = c2(tassaG);
        if (tassaG >= imp.tassa - 0.004) { giorniOk++; serie++; if (serie > serieMax) serieMax = serie; }
        else { giorniPersi++; serie = 0; }
      }
      giorni.push({
        ts: t0, idx: idx, rimasti: rimasti, base: base, budget: c2(budgetG),
        speso: spesoG, resta: resta, tassa: tassaG, chiuso: chiuso
      });
      speso = c2(speso + spesoG);
      tassaTot = c2(tassaTot + tassaG);
    }

    var ultimoG = giorni[giorni.length - 1] || null;
    var impegnato = fisse.reduce(function (a, r) { return a + r.restaDaUscire; }, 0);
    var uscitoFisse = fisse.reduce(function (a, r) { return a + (r.fuori ? r.uscitaEffettiva : r.uscito); }, 0);
    var salvFisse = fisse.reduce(function (a, r) { return a + r.risparmio; }, 0);
    var sforoFisse = fisse.reduce(function (a, r) { return a + r.sforo; }, 0);

    // budget residuo del ciclo, alla data di oggi
    var residuo = c2(disponibile - speso - tassaTot + dist + rett);

    return {
      ciclo: ciclo, fisse: fisse, fissePesano: c2(fissePesano), quote: c2(quote), quotePer: quotePer,
      disponibile: disponibile, giorni: giorni, oggiG: ultimoG,
      speso: speso, tassa: tassaTot, dist: c2(dist), rett: c2(rett), residuo: residuo,
      impegnato: c2(impegnato), uscitoFisse: c2(uscitoFisse), salvFisse: c2(salvFisse), sforoFisse: c2(sforoFisse),
      giorniTot: giorniTot, giorniOk: giorniOk, giorniPersi: giorniPersi, serie: serie, serieMax: serieMax
    };
  }

  /* ============================================================
     STATO COMPLETO
     ============================================================ */
  function stato(store, oggi) {
    oggi = oggi || oggiTs();
    var imp = store.imp;
    var lista = cicli(store, oggi);
    var piano = pianoQuote(store, lista, oggi);
    var accCorrente = piano.acc;

    var salv = 0, salvF = 0, chiusi = [];
    var corrente = null, simCorrente = null;
    for (var i = 0; i < lista.length; i++) {
      var c = lista[i];
      var attivo = oggi >= c.ini && oggi <= c.fin;
      var sim = simula(store, c, oggi, piano.quote[i]);
      if (attivo) { corrente = c; simCorrente = sim; }
      salv = c2(salv + sim.tassa);
      salvF = c2(salvF + sim.salvFisse);
      if (oggi > c.fin) {
        // ciclo chiuso: quello che avanza (budget non speso + fisse mai uscite) diventa risparmio
        var avanzo = c2(sim.residuo + sim.impegnato);
        salv = c2(salv + Math.max(0, avanzo));
        chiusi.push({ c: c, sim: sim, avanzo: avanzo });
      }
    }
    // saldi iniziali e movimenti diretti sul salvadanaio
    store.ev.forEach(function (e) {
      if (e.t === "salvIni") salv = c2(salv + e.imp);
      if (e.t === "dist") salv = c2(salv - e.imp);
      if (e.t === "spesa" && e.fonte === "salv") salv = c2(salv - e.imp);
    });

    // fondo cassa: ultimo valore dichiarato
    var fc = imp.fc || 0;
    var evFc = store.ev.filter(function (e) { return e.t === "fc"; }).sort(function (a, b) { return a.ts - b.ts; });
    if (evFc.length) fc = evFc[evFc.length - 1].valore;

    var accTot = 0;
    store.buste.forEach(function (b) { accTot = c2(accTot + (accCorrente[b.id] || 0)); });

    var residuoCiclo = simCorrente ? simCorrente.residuo : 0;
    var impegnato = simCorrente ? simCorrente.impegnato : 0;

    // ===== L'IDENTITA' =====
    // Banca = Fondo cassa + Accantonati + Salvadanai + Impegnato + Budget residuo
    var attesoBanca = c2(fc + accTot + salv + salvF + impegnato + residuoCiclo);

    // rettifiche "fuori app": spostano la banca senza toccare il budget
    var fuoriApp = 0;
    store.ev.forEach(function (e) { if (e.t === "rett" && e.causa === "fuori") fuoriApp = c2(fuoriApp + e.imp); });
    attesoBanca = c2(attesoBanca + fuoriApp);

    var letture = store.ev.filter(function (e) { return e.t === "lettura"; })
      .sort(function (a, b) { return ts(a.d) - ts(b.d) || a.ts - b.ts; });
    var ultimaLettura = letture.length ? letture[letture.length - 1] : null;

    return {
      oggi: oggi, imp: imp, cicli: lista, ciclo: corrente, sim: simCorrente, chiusi: chiusi,
      fc: c2(fc), acc: accCorrente, accTot: accTot, salv: c2(salv), salvF: c2(salvF),
      impegnato: impegnato, budget: residuoCiclo, fuoriApp: fuoriApp,
      attesoBanca: attesoBanca, ultimaLettura: ultimaLettura,
      // soglia sotto cui non scendere: e' denaro che c'e' ma non e' tuo da spendere
      soglia: c2(fc + accTot + salv + salvF)
    };
  }

  /* ============================================================
     LA PREVISIONE — parte dal saldo che hai letto, non da una stima
     Saldo letto
       - quello che e' uscito dopo la lettura
       = quello che c'e' adesso sul conto
       - fondo cassa
       - fisse che devono ancora uscire
       - residuo delle spese previste (carburante: previsti 150, spesi 75 -> restano 75)
       - quote da mettere da parte e accantonamenti dei mesi scorsi
       = IL NETTO, cioe' i soldi tuoi fino alla prossima paga
     ============================================================ */
  function evTs(e) { return e.ts || ts(e.d); }

  function previsione(store, oggi, st) {
    oggi = oggi || oggiTs();
    st = st || stato(store, oggi);
    var sim = st.sim;
    if (!sim) return null;
    var L = st.ultimaLettura;

    // --- l'ancora ---
    var ancora;
    if (L) ancora = { tipo: "lettura", saldo: L.saldo, ts: evTs(L), d: L.d };
    else ancora = {
      tipo: "stima", saldo: c2(st.fc + st.accTot + st.salv + st.salvF + sim.ciclo.stip),
      ts: ts(iso(sim.ciclo.ini)), d: iso(sim.ciclo.ini)
    };

    // --- che cosa e' uscito dal conto DOPO quel momento ---
    var dopo = [];
    store.ev.forEach(function (e) {
      if ((e.t === "spesa" || e.t === "fissa") && evTs(e) > ancora.ts) {
        var nome = e.t === "fissa" ? "voce fissa" : (e.nota || e.cat || "spesa");
        store.fisse.forEach(function (f) { if (f.id === e.fissaId) nome = f.nome; });
        dopo.push({ id: e.id, d: e.d, ts: evTs(e), nome: nome, imp: e.imp, tipo: e.t });
      }
    });
    // addebiti automatici scattati dopo la lettura e mai confermati a mano
    sim.fisse.forEach(function (r) {
      if (r.autoUscita && r.scad != null && r.scad > ancora.ts - 43200000) {
        dopo.push({ id: "auto-" + r.f.id, d: iso(r.scad), ts: r.scad, nome: r.f.nome, imp: r.f.prev, tipo: "auto" });
      }
    });
    dopo.sort(function (a, b) { return a.ts - b.ts; });
    var totDopo = c2(dopo.reduce(function (a, x) { return a + x.imp; }, 0));
    var reale = c2(ancora.saldo - totDopo);

    // --- gli impegni che restano ---
    var fisseDaPagare = [], previste = [];
    sim.fisse.forEach(function (r) {
      if (r.fuori) return;
      if (r.f.blind) {
        if (r.restaDaUscire > 0.004)
          fisseDaPagare.push({ id: r.f.id, icona: r.f.icona, nome: r.f.nome, imp: r.restaDaUscire, quando: r.scad });
      } else if (r.restaDaUscire > 0.004) {
        previste.push({
          id: r.f.id, icona: r.f.icona, nome: r.f.nome, prev: r.f.prev,
          speso: r.uscito, imp: r.restaDaUscire
        });
      }
    });
    var totFisse = c2(fisseDaPagare.reduce(function (a, x) { return a + x.imp; }, 0));
    var totPreviste = c2(previste.reduce(function (a, x) { return a + x.imp; }, 0));

    // --- le buste ---
    var buste = store.buste.map(function (b) {
      return {
        id: b.id, icona: b.icona, nome: b.nome,
        accumulato: c2(st.acc[b.id] || 0), quota: c2(sim.quotePer[b.id] || 0),
        scad: scadBusta(store, b)
      };
    }).filter(function (b) { return b.accumulato > 0.004 || b.quota > 0.004; });
    var totBuste = c2(buste.reduce(function (a, x) { return a + x.accumulato; }, 0));

    // --- il salvadanaio della tassa: soldi gia' messi via, non spendibili ---
    var salvadanai = c2(st.salv + st.salvF);

    var netto = c2(reale - st.fc - totFisse - totPreviste - totBuste - salvadanai);
    var giorniRimasti = Math.max(1, giorniTra(oggi, sim.ciclo.fin) + 1);

    return {
      ancora: ancora, dopo: dopo, totDopo: totDopo, reale: reale,
      fc: st.fc, fisseDaPagare: fisseDaPagare, totFisse: totFisse,
      previste: previste, totPreviste: totPreviste,
      buste: buste, totBuste: totBuste, salvadanai: salvadanai,
      netto: netto, giorniRimasti: giorniRimasti,
      alGiorno: c2(netto / giorniRimasti),
      // lo scarto fra quello che il registro si aspetta e quello che hai letto
      scarto: L ? c2(L.saldo - st.attesoBanca) : null
    };
  }

  /* ============================================================
     LETTURE DERIVATE PER LA SCHERMATA "OGGI"
     ============================================================ */
  function oggiVista(st) {
    var s = st.sim;
    if (!s || !s.oggiG) return null;
    var g = s.oggiG;
    var bOggi = g.budget;
    var speso = g.speso;
    var resta = c2(bOggi - speso);
    var tassa = st.imp.tassa || 0;
    var quotaTassa = Math.max(0, Math.min(tassa, bOggi));
    var spendibile = c2(bOggi - quotaTassa);
    var tassaSalva = Math.max(0, Math.min(tassa, resta));

    // budget di domani, dalla stessa base
    var rimastiDomani = Math.max(0, s.giorniTot - g.idx - 1);
    var baseDomani = c2(g.base - speso - tassaSalva);
    var bDomani = rimastiDomani > 0 ? c2(baseDomani / rimastiDomani) : baseDomani;

    // budget iniziale del ciclo
    var bIni = c2(s.disponibile / s.giorniTot);

    // ritmo e autonomia
    var chiusi = s.giorni.filter(function (x) { return x.chiuso; });
    var ultimi = chiusi.slice(-7);
    var ritmo7 = ultimi.length ? c2(ultimi.reduce(function (a, x) { return a + x.speso; }, 0) / ultimi.length) : 0;
    var ritmoCiclo = chiusi.length ? c2(s.speso / (chiusi.length + 1)) : speso;
    var ritmo = ritmo7 > 0 ? ritmo7 : ritmoCiclo;
    var giorniAut = ritmo > 0.004 ? Math.floor(c2(s.residuo) / ritmo) : 999;
    var esaurimento = piuGiorni(st.oggi, Math.max(0, giorniAut));
    var giorniAllaPaga = giorniTra(st.oggi, s.ciclo.fin) + 1;
    var arrivi = giorniAut >= giorniAllaPaga;

    return {
      bIni: bIni, bOggi: bOggi, bDomani: bDomani, delta: c2(bDomani - bOggi),
      speso: speso, resta: resta, spendibile: spendibile, quotaTassa: c2(quotaTassa),

  }

  /* costo di una spesa espresso in giornate di budget */
  function inGiorni(imp, bOggi) {
    if (!bOggi || bOggi <= 0.004) return null;
    return imp / bOggi;
  }

  /* ============================================================
     AZIONI
     ============================================================ */
  function registraPaga(store, importo, dataIso) {
    return ev(store, { t: "paga", imp: c2(importo), d: dataIso || iso(oggiTs()) });
  }
  function registraSpesa(store, o) {
    return ev(store, {
      t: "spesa", imp: c2(o.imp), d: o.d || iso(oggiTs()), cat: o.cat || null,
      fissaId: o.fissaId || null, fonte: o.fonte || "budget", nota: o.nota || "", chi: o.chi || ""

  function chiudiFissa(store, fissaId, importo, dataIso) {

  }

    return ev(store, { t: "dist", imp: c2(importo) });

  function rettifica(store, importo, causa, dataIso) {
    return ev(store, { t: "rett", imp: c2(importo), causa: causa, d: dataIso || iso(oggiTs()) });

  }

    return ev(store, { t: "fc", valore: c2(valore), motivo: motivo || "" });
  }

    return ev(store, { t: "versaExtra", bustaId: bustaId, imp: c2(importo) });
  }
  // Pagare la spesa per cui la busta esisteva. Quello che l'accantonato non copre
  // lo mette il budget del mese: cosi' la busta non va mai sotto zero.
  function pagaBusta(store, bustaId, importo, dataIso) {
    var st = stato(store, oggiTs());
    var b = null;
    store.buste.forEach(function (x) { if (x.id === bustaId) b = x; });
    if (!b) return null;
    var disp = Math.max(0, st.acc[bustaId] || 0);
    var dalla = Math.min(disp, c2(importo));
    var resto = c2(importo - dalla);
    if (dalla > 0.004) registraSpesa(store, { imp: dalla, fonte: "busta:" + bustaId, nota: b.nome, d: dataIso, cat: "Buste" });
    if (resto > 0.004) registraSpesa(store, { imp: resto, fonte: "budget", nota: b.nome + " (oltre l'accantonato)", d: dataIso, cat: "Buste" });
    var sc = scadBusta(store, b);
    if (sc && b.ric > 0) ev(store, { t: "rinnova", bustaId: bustaId, scad: piuMesi(sc, b.ric), d: dataIso || iso(oggiTs()) });
    return { dalla: dalla, resto: resto };
  }

  /* ============================================================
     MIGRAZIONE DALLA VERSIONE 1 (non distruttiva)
     ============================================================ */
  function migra(vecchio) {
    var s = nuovoStore();
    if (!vecchio) return s;
    var v = vecchio;
    s.imp.stip = v.stip || 0;
    s.imp.gPaga = parseInt(v.gPaga, 10) || 15;
    s.imp.tassa = v.tassa || 0;
    s.imp.fc = v.fc || 0;
    s.imp.avvioFatto = true;

    (v.sf || []).forEach(function (f) {
      s.fisse.push({
        id: f.id, nome: f.nome, icona: f.icon || "\u25CF", prev: f.prev || 0,
        blind: !!f.blind, gg: f.gg || null
      });
    });
    (v.annuali || []).forEach(function (a) {
      s.buste.push({
        id: a.id, nome: a.nome, icona: a.icon || "\u25CF", obiettivo: a.imp || 0,
        scad: a.scad || null, ric: a.ric || 0, quota: a.quotaMan || 0, attiva: true
      });
    });

    // data di inizio del ciclo in corso
    var oggi = oggiTs(), gp = s.imp.gPaga;
    var ini;
    var pa = String(v.accredito || "").split("/");
    if (pa.length === 3) {
      var cand = new Date(+pa[2], +pa[1] - 1, +pa[0]); cand.setHours(0, 0, 0, 0);
      if (cand.getTime() <= oggi && oggi < piuGiorni(cand.getTime(), 31)) ini = cand.getTime();
    }
    if (!ini) {
      var d = new Date(oggi);
      ini = d.getDate() >= gp ? new Date(d.getFullYear(), d.getMonth(), gp).getTime()
        : new Date(d.getFullYear(), d.getMonth() - 1, gp).getTime();
    }
    ev(s, { t: "paga", imp: s.imp.stip, d: iso(ini), ts: ini });

    // salvadanaio: quello dei cicli precedenti entra come saldo iniziale
    var salvVecchio = Math.max(0, (v.salvRisp || 0) - (v.salvCiclo || 0));
    if (salvVecchio > 0.004) ev(s, { t: "salvIni", imp: c2(salvVecchio), d: iso(ini), ts: ini });

    // accantonati delle buste
    (v.annuali || []).forEach(function (a) {
      if ((a.acc || 0) > 0.004) ev(s, { t: "accIni", bustaId: a.id, imp: c2(a.acc), d: iso(ini), ts: ini });
    });

    // spese
    (v.spV || []).forEach(function (x) {
      var p = String(x.data || "").split("/");
      if (p.length < 3) return;
      var dIso = p[2] + "-" + ("0" + p[1]).slice(-2) + "-" + ("0" + p[0]).slice(-2);
      var fonte = x.fromSalv ? "salv" : (x.fromAnn ? "busta:?" : "budget");
      if (fonte === "busta:?") fonte = "budget";       // senza riferimento certo: resta sul budget
      s.ev.push({
        id: x.id || id(), t: "spesa", imp: c2(x.imp || 0), d: dIso,
        cat: x.cat || null, fissaId: x.fId || null, fonte: fonte,
        nota: x.desc || "", chi: x.chi || "", ts: x.ts || ts(dIso)
      });
    });

    // fondo cassa dichiarato
    if ((v.fc || 0) > 0.004) ev(s, { t: "fc", valore: c2(v.fc), motivo: "importato dalla versione precedente", d: iso(ini), ts: ini });
    return s;
  }

  return {
    GIORNO: GIORNO, MESI: MESI, GG: GG,
    iso: iso, ts: ts, oggiTs: oggiTs, piuGiorni: piuGiorni, piuMesi: piuMesi, giorniTra: giorniTra,
    lbl: lbl, lblLungo: lblLungo, lblGiorno: lblGiorno,
    c2: c2, eur: eur, eur0: eur0, id: id,
    nuovoStore: nuovoStore, ev: ev, togliEv: togliEv,
    cicli: cicli, statoFisse: statoFisse, quotaBusta: quotaBusta, simula: simula,
    pianoQuote: pianoQuote, scadBusta: scadBusta, pagaBusta: pagaBusta,
    stato: stato, oggiVista: oggiVista, inGiorni: inGiorni,
    previsione: previsione, pagheDoppie: pagheDoppie, evTs: evTs,
    registraPaga: registraPaga, registraSpesa: registraSpesa, chiudiFissa: chiudiFissa,
    distribuisci: distribuisci, rettifica: rettifica, leggiSaldo: leggiSaldo,
    fissaFondoCassa: fissaFondoCassa, versaInBusta: versaInBusta,
    migra: migra
  };
})();

    );

  /* ============================================================
     STRUTTURA
     ============================================================ */
  var schede = { oggi: vistaOggi, spese: vistaSpese, piano: vistaPiano, conto: vistaConto, altro: vistaAltro };
  var voci = [["oggi", "Oggi"], ["spese", "Spese"], ["piano", "Piano"], ["conto", "Conto"], ["altro", "Altro"]];

  return e("div", { style: { fontFamily: SANS, color: K.inchiostro, paddingBottom: 74 } },
    /* testata */
    e("div", { style: { padding: "16px 0 12px", borderBottom: "2px solid " + K.inchiostro, marginBottom: 14 } },
      e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline" } },
        e("div", { style: { fontFamily: SERIF, fontSize: 21, fontWeight: 400, letterSpacing: .2 } }, "Registro di casa"),
        e("div", { style: { fontFamily: SANS, fontSize: 10.5, color: K.tenue } },
          M.lblGiorno(oggi) + " " + M.lbl(oggi))),
      e("div", { style: { display: "flex", justifyContent: "space-between", marginTop: 4, fontFamily: SANS, fontSize: 11, color: K.tenue } },

}
