var HELP={
  budget3:{em:"\u{1F9EE}",tit:"I tre budget",msg:"INIZIALE: (stipendio \u2212 spese fisse) diviso 31, il punto di partenza del mese. OGGI: i soldi rimasti divisi per i giorni che mancano, ricalcolato ogni mattina. DOMANI: l'anteprima di come cambia se chiudi la giornata cos\u00ec. Esempio: 1.850 \u2212 650 di fisse = 1.200, diviso 31 = \u20AC38,71 al giorno."},
  comeNasce:{em:"\u{1F4C5}",tit:"Come nasce il budget di oggi",msg:"Ogni mattina l'app prende i soldi che restano davvero (disponibile \u2212 speso nei giorni passati \u2212 gi\u00e0 messo nel salvadanaio) e li divide per i giorni rimasti, oggi compreso. Se ieri hai speso poco, oggi il budget sale; se hai sforato, scende. Esempio: restano \u20AC600 e mancano 15 giorni \u2192 \u20AC40 al giorno."},
  oggiRestano:{em:"\u{1F3C6}",tit:"Oggi ti restano + Montepremi",msg:"Il riquadro verde divide il budget di oggi in due: la parte spendibile e la tassa di risparmio da proteggere. Il MONTEPREMI \u00e8 la proiezione: quanto avrai messo da parte a fine ciclo se rispetti la tassa ogni giorno. Esempio: budget \u20AC38, tassa \u20AC3 \u2192 spendibili \u20AC35; con 16 giorni davanti il montepremi promette fino a \u20AC48 in pi\u00f9."},
  obiettivi:{em:"\u{1F3AF}",tit:"Obiettivi di risparmio",msg:"Un obiettivo \u00e8 un acquisto che vuoi fare (cuffie, un pedale...) pagandolo col risparmio quotidiano invece che col budget. Ogni sera una percentuale della tassa risparmiata va nella sua barra; a cifra raggiunta decidi a mente fredda se comprare o rinunciare (e tenerti i soldi). Esempio: cuffie da \u20AC80 al 50% della tassa da \u20AC3 \u2192 \u20AC1,50 a sera, pronte in circa 53 giorni."},
  salvadanaio:{em:"\u{1F4B0}",tit:"Ho risparmiato",msg:"Qui dentro ci sono solo soldi VERI gi\u00e0 messi da parte: le tasse serali rispettate, gli arrotondamenti, i versamenti. La quota \u201clibera\u201d \u00e8 quella non ancora prenotata da obiettivi o fondi. Rompere il salvadanaio preleva senza toccare il budget del giorno. Esempio: \u20AC57 totali, di cui \u20AC30 prenotati per le cuffie \u2192 \u20AC27 liberi."},
  barometro:{em:"\u2696\uFE0F",tit:"Barometro 50/30/20",msg:"La regola dei conti sani: circa met\u00e0 stipendio per le necessit\u00e0, un terzo per i desideri, un quinto per il risparmio. Il barometro confronta le tue uscite reali con questi riferimenti; non \u00e8 un voto, \u00e8 una bussola. Esempio: su \u20AC1.850 \u2192 \u20AC925 necessit\u00e0, \u20AC555 desideri, \u20AC370 risparmio."},
  sett7:{em:"\u{1F4CA}",tit:"Ultimi 7 giorni",msg:"La media di spesa dell'ultima settimana confrontata col budget giornaliero: se la media \u00e8 sotto, sei in rotta giusta. Sotto trovi le tre categorie che hanno pesato di pi\u00f9. Esempio: spesi \u20AC210 in 7 giorni \u2192 media \u20AC30 al giorno contro un budget di \u20AC38: bene."},
  fisse:{em:"\u{1F4CC}",tit:"Le spese fisse e la regola d'oro",msg:"Ogni voce fissa pesa sul budget SEMPRE almeno il previsto: se spendi meno, il budget non sale e la differenza va nel salvadanaio fisse; se sfori, lo sforo scende subito dal budget dei giorni rimasti. Le voci blindate (\u{1F512}) valgono sempre esattamente il previsto. Con \u270F\uFE0F Modifica puoi anche dire in che giorno del mese esce l'addebito (utile per abbonamenti e rate): \u00e8 facoltativo, ma con la data l'app la segna uscita DA SOLA quando il giorno arriva: tu tocchi solo se la banca ritarda l'addebito. Esempio: Luce prevista \u20AC30, bolletta \u20AC22 \u2192 \u20AC8 nel salvadanaio, budget intatto."},
  salvFisse:{em:"\u{1F416}",tit:"Salvadanaio spese fisse",msg:"Qui si accumulano le differenze delle voci confermate SOTTO il previsto. \u00c8 separato dal salvadanaio della tassa: questo nasce dalle bollette andate bene, quello dalla disciplina quotidiana. A fine mese decidi come dividerlo tra risparmi e svago. Esempio: Luce \u20AC8 + Gas \u20AC5 risparmiati \u2192 \u20AC13 nel salvadanaio fisse."},
  spese:{em:"\u{1F4B8}",tit:"Registrare le spese",msg:"\u{1F4CC} Fissa = un acconto su una voce fissa (benzina, spesa vestiti). \u{1F4B8} Extra = spesa variabile con categoria. Il campo \u{1F4C5} Giorno normalmente resta su oggi: se ti sei dimenticato uno scontrino, mettici la data vera e lo scoperto di quel giorno si spalma sui giorni che restano invece di distruggere la giornata di oggi. Esempio: \u20AC35 dimenticati ieri, con 15 giorni davanti \u2192 il budget cala di poco pi\u00f9 di \u20AC2 al giorno invece di mangiarsi tutti i \u20AC33 di oggi."},
  monitor:{em:"\u{1F4CA}",tit:"Dove vanno i soldi",msg:"La classifica delle uscite del ciclo, per capire a colpo d'occhio cosa pesa. Con \u2699\uFE0F scegli tu quali voci monitorare (solo variabili, oppure anche le fisse); la percentuale si pu\u00f2 calcolare sul totale speso o sullo stipendio. Esempio: Alimentari \u20AC240 = 35% del totale speso."},
  tassa:{em:"\u{1F416}",tit:"La tassa di risparmio",msg:"\u00c8 l'obiettivo di risparmio quotidiano: ogni sera, se nel budget di oggi \u00e8 rimasto almeno quell'importo, finisce automaticamente nel salvadanaio. Se la giornata \u00e8 andata male non si accumula nulla (niente debiti di risparmio). La serie \u{1F525} conta i giorni consecutivi riusciti. Esempio: tassa \u20AC3 \u00d7 30 giorni rispettati = \u20AC90 messi via senza pensarci."},
  arrotonda:{em:"\u{1FA99}",tit:"Arrotondamento delle spese",msg:"Ogni spesa extra viene arrotondata all'euro (o ai 5 euro) e la differenza scivola nel salvadanaio: un micro-risparmio invisibile che a fine mese si sente. Vale solo per le spese di oggi, non per quelle retrodatate. Esempio: caff\u00e8 \u20AC1,20 arrotondato a \u20AC2 \u2192 \u20AC0,80 nel salvadanaio."},
  contoPartenza:{em:"\u{1F3E6}",tit:"Il saldo di partenza",msg:"Scrivi quanto c'era sul conto il giorno dello stipendio (stipendio compreso). Se lo scrivi in ritardo nessun problema: digita il saldo che vedi ADESSO e l'app ricostruisce da sola la partenza aggiungendo le uscite gi\u00e0 registrate nei giorni passati. Esempio: oggi vedi \u20AC1.900, uscite gi\u00e0 registrate \u20AC200 \u2192 partenza ricostruita \u20AC2.100."},
  contoVerdetto:{em:"\u{1F9FE}",tit:"Il verdetto del conto",msg:"L'app calcola quanto DOVREBBE esserci sul conto (partenza \u2212 fisse realmente uscite \u2212 spese variabili + movimenti fuori app) e lo confronta col saldo che leggi in banca. Uno scarto entro \u20AC2 \u00e8 fisiologico; se mancano soldi (ROSSO) c'\u00e8 un'uscita non registrata da sistemare; se ce ne sono di pi\u00f9 (VERDE) c'\u00e8 un'entrata non segnata: nessun problema, e se non li spendi faranno materasso alla prossima paga. La tassa e i salvadanai NON si sottraggono: quei soldi sono ancora sul conto, solo prenotati. Esempio: atteso \u20AC1.310, letto \u20AC1.295 \u2192 mancano \u20AC15 all'appello."},
  contoPrenotato:{em:"\u{1F53B}",tit:"Uscir\u00e0 dal conto",msg:"Soldi che vedi in banca ma se ne andranno: le voci blindate non ancora addebitate (affitto, rate) e quello che manca alle voci in corso per arrivare al previsto. Le voci con la data di addebito spariscono da sole quando il giorno passa; quelle senza data le spunti tu con \u2713. Esempio: affitto \u20AC450 non ancora addebitato + \u20AC110 mancanti al carburante = \u20AC560 che se ne andranno."},
  contoRisparmio:{em:"\u{1F512}",tit:"Resta, ma \u00e8 gi\u00e0 risparmio",msg:"Questi soldi NON usciranno dal conto, per\u00f2 non sono spendibili: sono le tasse serali gi\u00e0 messe da parte, gli arrotondamenti e i risparmi sulle bollette. Restano in banca a fare da materasso. \u00c8 la differenza fondamentale con la voce sopra: quella se ne va, questa resta ma non si tocca. Esempio: \u20AC174 di salvadanaio tassa + \u20AC13 di salvadanaio fisse = \u20AC187 intoccabili."},
  contoPrevisione:{em:"\u{1F52E}",tit:"Previsione dell'estratto conto",msg:"Ogni volta che leggi il saldo in banca puoi registrarlo come punto di controllo. Da l\u00ec in poi l'app somma le uscite registrate e ti dice quanto dovresti leggere oggi: se il numero vero \u00e8 pi\u00f9 basso, la spesa mancante \u00e8 avvenuta in quei pochi giorni e la ritrovi facilmente. Esempio: luned\u00ec \u20AC3.100, da allora \u20AC260 di uscite \u2192 oggi dovresti leggere \u20AC2.840."},
  contoRettifica:{em:"\u2696\uFE0F",tit:"Rettificare uno scarto",msg:"Quando i conti non tornano hai due strade con effetti opposti. SPESA VERA: i soldi mancanti entrano tra le spese e il budget giornaliero scende \u2014 giusto quando hai dimenticato uno scontrino. MOVIMENTO FUORI APP: il conto quadra ma il budget non cambia \u2014 giusto per giroconti, prestiti o soldi spostati su un altro conto. Esempio: mancano \u20AC140 di spesa dimenticata \u2192 scegli spesa vera e il budget scende di circa \u20AC9 al giorno su 15 giorni."},
  fcMio:{em:"\u{1F512}",tit:"Fondo cassa deciso da te",msg:"Di norma il fondo cassa lo calcola l'app: \u00e8 quello che c'era sul conto prima che arrivasse lo stipendio. Con questa impostazione decidi tu la cifra sotto la quale non vuoi mai scendere, e l'app calcola i tuoi soldi liberi partendo da quella. Se metti una soglia PI\u00d9 ALTA di quello che hai, i liberi si riducono e l'app ti dice quanto manca per arrivarci: \u00e8 il modo di farlo crescere. Se la metti pi\u00f9 bassa, ti lascia pi\u00f9 respiro. Esempio: hai \u20AC2.016 e ti dai una soglia di \u20AC2.500 \u2014 l'app ti dice che ti mancano \u20AC484 e li protegge dal budget quotidiano."},
  contoObiettivi:{em:"\u{1F3AF}",tit:"Obiettivi: soldi gi\u00e0 destinati",msg:"Sono i soldi del salvadanaio che hai gi\u00e0 assegnato a un obiettivo o a un fondo. Restano in banca, ma non sono da spendere per la vita di tutti i giorni: hanno gi\u00e0 un nome. Quelli con la spunta verde sono RAGGIUNTI, cio\u00e8 pronti da usare per quello che avevi deciso. Li tolgo dal fondo cassa, non dal budget: erano gi\u00e0 messi via, quindi quando compri l'oggetto il budget del giorno non si muove: cala il conto, come \u00e8 giusto. Esempio: \u20AC80 per le cuffie raggiunti \u2014 li vedi qui, il materasso scende di \u20AC80 e il giorno che le compri non perdi budget."},
  alimentare:{em:"\u{1F6D2}",tit:"Budget spesa alimentare",msg:"Un tetto settimanale per la spesa di casa. Non \u00e8 un secondo portafoglio: conta gli acquisti che registri normalmente nelle Spese con categoria Alimentari (e Bimba, se lo attivi), quindi i soldi restano contati una volta sola. L'app fa il conto per te: quanto resta, quanto puoi spendere nei giorni che mancano, e se sei in linea col ritmo previsto. Esempio: budget \u20AC92 = \u20AC13,14 al giorno; se al terzo giorno hai speso \u20AC50 invece di \u20AC39,43, sei sopra di \u20AC10,57 e per rientrare hai \u20AC10,50 al giorno per i 4 giorni che restano."},
  scartoBudgetConto:{em:"\u2696\uFE0F",tit:"Perch\u00e9 conto e budget mostrano cifre diverse",msg:"QUALE SEGUIRE: per la spesa di tutti i giorni segui il budget in home, \u00e8 fatto per quello. Il numero della scheda Conto \u00e8 il controllo: se i due si allontanano, c'\u00e8 qualcosa da sistemare, e in quel caso ha ragione la banca. Le cause sono tre, tutte legittime. 1) SPESE NON REGISTRATE: la banca le ha viste, il piano no \u2014 si sistemano col bottone della rettifica. 2) QUOTE ANNUALI: il piano le mette da parte ogni mese, ma finch\u00e9 non cambia il ciclo sul conto sono ancora l\u00ec. 3) SOLDI SPESI DAI SALVADANAI O DAI FONDI: escono dalla banca ma non dallo stipendio del mese. Esempio: spendi \u20AC20 dal salvadanaio \u2014 il conto scende di \u20AC20, il budget giornaliero resta uguale."},
  annuali:{em:"\u{1F5D3}\uFE0F",tit:"Annuali e semestrali",msg:"Spese che arrivano una volta ogni tanto ma vanno preparate ogni mese. Con la scadenza: l'app divide il residuo per i mesi che mancano \u2014 se un mese non riesci ad accantonare, la quota si ridistribuisce da sola su quelli che restano, e arrivi puntuale comunque. Senza scadenza (fondo continuo, es. usura auto): accumuli una quota fissa e prelevi quando serve. I soldi accantonati restano sul conto ma NON sono tuoi: la scheda Conto li tiene separati. Esempio: assicurazione \u20AC350 a gennaio, da luglio sono \u20AC58,33 al mese; se luglio va male, da agosto diventano \u20AC70."},
  fcCrescita:{em:"\u{1F4C8}",tit:"Come cresce il fondo cassa",msg:"Il materasso si consolida al prossimo accredito: quello che avanza sul conto quel giorno diventa il nuovo fondo cassa. Cresce in due modi: con la tassa di risparmio messa via sera dopo sera, E con la parte di stipendio che semplicemente non spendi. L'app proietta il valore finale al ritmo di spesa che stai tenendo. Esempio: fondo cassa \u20AC2.000, ritmo attuale \u20AC10 al giorno \u2192 al prossimo accredito \u20AC2.130, di cui \u20AC39 di tassa e \u20AC91 di stipendio avanzato."},
  contoLibero:{em:"\u{1F4B5}",tit:"Veramente libero",msg:"Il saldo in banca dice una bugia: dentro ci sono i soldi che devono ancora uscire E quelli gi\u00e0 diventati risparmio. Qui vedi quanto \u00e8 davvero tuo da spendere: saldo letto \u2212 quello che uscir\u00e0 \u2212 i salvadanai. Esempio: \u20AC2.840 in banca \u2212 \u20AC560 che usciranno \u2212 \u20AC187 di salvadanai = \u20AC2.093 veri."},
  distribuisci:{em:"\u21A9\uFE0F",tit:"Distribuisci al budget",msg:"I soldi del salvadanaio sono tuoi: se ti servono per un imprevisto, non serve romperlo per forza su una spesa precisa. 'Distribuisci al budget' li rimette in circolo, spalmati in parti uguali su oggi e sui giorni che restano fino alla prossima paga \u2014 il salvadanaio scende, il budget di ogni giorno sale un poco. Diverso da 'Rompi per comprare': quello registra una spesa precisa e non tocca il budget quotidiano; questo invece alza il budget e lascia a te decidere come spenderlo. Esempio: \u20AC50 restituiti con 10 giorni rimanenti = +\u20AC5 al giorno."},
  fondoCassa:{em:"\u{1F3DB}\uFE0F",tit:"Fondo cassa",msg:"\u00c8 quello che c'era sul conto PRIMA che arrivasse lo stipendio: saldo del giorno paga meno lo stipendio. Cresce in due modi, ed \u00e8 sempre lo stesso denaro: la tassa di risparmio che accumuli giorno per giorno, e quello che non spendi dello stipendio quando il ciclo si chiude. Per questo il salvadanaio dei mesi scorsi \u00e8 gi\u00e0 dentro questo numero e non va tolto una seconda volta. Gli unici soldi che ne tolgo sono gli accantonati per le spese annuali, perch\u00e9 quelli dal conto usciranno davvero. \u00c8 il materasso: quello che c'era sul conto PRIMA che arrivasse lo stipendio (partenza \u2212 stipendio). Non si tocca durante il ciclo: si aggiorna al prossimo accredito, quando quello che \u00e8 avanzato diventa il nuovo materasso. Esempio: partenza \u20AC3.850 \u2212 stipendio \u20AC1.850 = fondo cassa \u20AC2.000."},
  contoPartenzaModo:{em:"\u{1F4CD}",tit:"Quale saldo stai scrivendo?",msg:"SALDO DI OGGI: scrivi quello che leggi adesso e l'app ricostruisce la partenza risommando le uscite gi\u00e0 registrate nei giorni passati \u2014 comodo se ti ricordi in ritardo. SALDO DEL GIORNO PAGA: scrivi il numero esatto che c'era in banca il giorno dell'accredito, senza ricostruzioni \u2014 preciso, se hai l'estratto conto sotto mano. Esempio: il giorno paga avevi \u20AC3.850 \u2192 scegli la seconda e scrivi 3850."}

function jbCreate(cb){
  var xhr=new XMLHttpRequest();
  xhr.open("POST","https://api.jsonbin.io/v3/b",true);
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.setRequestHeader("X-Master-Key",JB_KEY());

  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      if(xhr.status===200){try{var r=JSON.parse(xhr.responseText);cb(r.metadata.id);}catch(ex){cb(null);}}
      else cb(null);
    }
  };
  xhr.send(JSON.stringify({spV:[],ver:2}));
}
function jbRead(cb){

  xhr.setRequestHeader("X-Master-Key",JB_KEY());
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      if(xhr.status===200){try{var r=JSON.parse(xhr.responseText);cb(r.record);}catch(ex){cb(null);}}
      else cb(null);
    }
  };
  xhr.send();
}
function jbWrite(data,cb){
  var bin=JB_BIN();if(!bin){if(cb)cb(false);return;}
  var xhr=new XMLHttpRequest();
  xhr.open("PUT","https://api.jsonbin.io/v3/b/"+bin,true);
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.setRequestHeader("X-Master-Key",JB_KEY());
  xhr.onreadystatechange=function(){if(xhr.readyState===4&&cb)cb(xhr.status===200);};
  xhr.onerror=function(){if(cb)cb(false);};
  xhr.send(JSON.stringify(data));
}

}

  // Funzione RESTITUISCI AL BUDGET: soldi che tornano indietro, spalmati sui giorni rimanenti

  var versaOra=function(id,importo){
    var q=Math.max(0,salvRisp-goals.reduce(function(a,g){return a+(g.acc||0);},0));
    var imp=Math.max(0,Math.min(importo,q));
    if(imp<=0.004)return;
    setGoals(function(prev){return prev.map(function(x){
      if(x.id!==id)return x;
      var nuovo=(x.acc||0)+imp;
      if(x.imp!=null&&nuovo>x.imp)nuovo=x.imp; // non oltre il traguardo
      return Object.assign({},x,{acc:nuovo});
    });});
  };

    var spazio=(g.imp!=null)?Math.max(0,g.imp-(g.acc||0)):q;

    if(pct>0){var vp=Math.min(q,spazio,q*pct/100);if(vp>0.004)bts.push({lbl:pct+"% del libero = \u20AC"+fm(vp),fn:function(){versaOra(g.id,vp);}});}
