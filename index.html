<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEEE8">
<title>Registro di casa</title>

<!-- ════════════════════════════════════════════════════════════
     BLOCCO STILE
     ════════════════════════════════════════════════════════════ -->
<style>
:root{
  --carta:#EDEEE8; --alta:#FFFFFF; --inchiostro:#1B2A41; --tenue:#6B7684;
  --riga:#DDDFD8; --verde:#2E6B45; --rosso:#B23A32; --ottone:#9A7328; --blu:#2C5C8F;
  --rossoL:#F8EAE8; --verdeL:#E9F1EB; --ottoneL:#F6F0E2;
  --mono:ui-monospace,"Roboto Mono","DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Georgia,"Noto Serif",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--carta);color:var(--inchiostro);font-family:var(--sans);
  font-size:15px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:540px;margin:0 auto;padding:12px 13px 0}

.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-family:var(--sans);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.14em;color:var(--tenue);font-weight:600}
.serif{font-family:var(--serif);font-size:13px;color:var(--tenue);line-height:1.5}
.ross{color:var(--rosso)} .verd{color:var(--verde)} .ott{color:var(--ottone)}
.blu{color:var(--blu)} .ten{color:var(--tenue)}

.testata{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 2px 12px;
  border-bottom:2px solid var(--inchiostro);margin-bottom:12px}
.testata h1{font-family:var(--serif);font-size:21px;font-weight:400;margin:0;letter-spacing:.2px}
.testata .v{font-family:var(--mono);font-size:9px;color:var(--tenue);letter-spacing:.5px}
.testata .dx{text-align:right;font-size:12.5px;color:var(--tenue)}

.carta{background:var(--alta);border:1px solid var(--riga);border-radius:4px;
  padding:14px;margin-bottom:11px}
.carta.acc{border-left:3px solid var(--inchiostro)}
.carta.verde{border-left:3px solid var(--verde)}
.carta.rossa{border-left:3px solid var(--rosso)}
.carta.ottone{border-left:3px solid var(--ottone)}

.grande{font-family:var(--mono);font-size:36px;font-weight:700;letter-spacing:-.04em;line-height:1}
.medio{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.03em}

/* ---- le domande cliccabili ---- */
.dom{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 0;
  border-bottom:1px solid var(--riga);cursor:pointer;font:inherit;color:inherit;position:relative}
.dom:last-of-type{border-bottom:0}
.dom .q{font-size:12.5px;color:var(--tenue);padding-right:22px}
.dom .a{font-size:15.5px;font-weight:600;margin-top:2px}
.dom .a.vuota{color:var(--blu);font-weight:500}
.dom .sub{font-size:11.5px;color:var(--tenue);margin-top:1px}
.dom .frec{position:absolute;right:2px;top:12px;color:var(--tenue);font-size:15px}
.dom:active{background:var(--carta)}

.riq{background:var(--carta);border-radius:4px;padding:13px;margin-top:11px}
.riq.bordo{border-left:3px solid var(--ottone)}

.riga{display:flex;align-items:baseline;gap:9px;padding:7px 0;border-bottom:1px solid var(--riga)}
.riga:last-child{border-bottom:0}
.riga .et{flex:1;min-width:0;font-size:13.5px}
.riga .et small{display:block;color:var(--tenue);font-size:11px;line-height:1.35}
.riga .vl{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;
  white-space:nowrap;font-weight:600}
.riga.tot{border-top:2px solid var(--inchiostro);border-bottom:0;margin-top:3px;padding-top:9px}
.riga.tot .et{font-weight:700;font-size:14.5px}
.riga.tot .vl{font-size:16px}

.formula{margin-top:11px;padding:11px;background:var(--alta);border-radius:3px;text-align:center;
  font-family:var(--mono);font-size:13.5px;font-weight:700;border:1px solid var(--riga)}
.formula b{font-size:18px}

.btn{display:block;width:100%;padding:11px;border:1px solid var(--inchiostro);
  background:var(--inchiostro);color:#fff;border-radius:3px;font-size:14px;font-weight:600;
  cursor:pointer;margin-top:8px;font-family:var(--sans)}
.btn.vuoto{background:transparent;color:var(--inchiostro)}
.btn.picc{padding:8px;font-size:12.5px}
.btn.rossa{background:var(--rosso);border-color:var(--rosso);color:#fff}
.btn.verde{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.ottone{background:transparent;border-color:var(--ottone);color:var(--ottone)}
.btn:active{transform:translateY(1px)}
.duo{display:flex;gap:8px}

input,select,textarea{width:100%;padding:10px;border:1px solid var(--riga);border-radius:3px;
  background:var(--alta);color:var(--inchiostro);font:inherit;margin-top:5px}
input[type=number],input.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
label{display:block;margin-top:11px}
label .eyebrow{display:block;margin-bottom:2px}

.chip{display:inline-block;padding:6px 11px;border-radius:99px;border:1px solid var(--riga);
  background:transparent;color:var(--tenue);font-size:11.5px;font-weight:600;cursor:pointer;
  margin:0 5px 5px 0;font-family:var(--sans)}
.chip.on{background:var(--inchiostro);border-color:var(--inchiostro);color:#fff}

.voce{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--riga)}
.voce:last-child{border-bottom:0}
.voce .nm{flex:1;min-width:0}
.voce .nm b{display:block;font-size:13.5px;font-weight:600}
.voce .nm small{color:var(--tenue);font-size:11px}
.voce .vv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.voce .x{background:none;border:0;color:var(--tenue);font-size:17px;cursor:pointer;padding:0 3px;line-height:1}
.pill{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;
  padding:2px 5px;border:1px solid currentColor;border-radius:2px;vertical-align:1px;font-weight:700}

.barra{height:5px;background:var(--riga);border-radius:3px;margin-top:4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--inchiostro)}
.avviso{padding:10px 12px;border-radius:3px;font-size:12.5px;line-height:1.55;margin-top:10px}
.avviso.r{background:var(--rossoL);border-left:3px solid var(--rosso)}
.avviso.v{background:var(--verdeL);border-left:3px solid var(--verde)}
.avviso.o{background:var(--ottoneL);border-left:3px solid var(--ottone)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--alta);border-top:1px solid var(--riga);
  display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 2px 11px;cursor:pointer;font-size:10px;
  color:var(--tenue);border-top:2px solid transparent;margin-top:-1px;font-family:var(--sans);
  font-weight:600;letter-spacing:.04em}
nav button.on{color:var(--inchiostro);border-top-color:var(--inchiostro)}
nav button b{display:block;font-size:17px;line-height:1.2;font-weight:400}

.velo{position:fixed;inset:0;background:rgba(27,42,65,.5);z-index:60;display:flex;
  align-items:flex-end;justify-content:center}
.fin{background:var(--alta);width:100%;max-width:540px;border-radius:8px 8px 0 0;
  padding:17px 16px calc(17px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.fin h3{font-family:var(--serif);font-size:19px;margin:0 0 5px;font-weight:400}
.fin p{font-size:13px;color:var(--tenue);margin:0 0 6px;white-space:pre-line;line-height:1.55}
.vuota{text-align:center;padding:22px 10px;color:var(--tenue);font-family:var(--serif);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="fin"></div>
<script>
var VERSIONE = "4.0 \u00b7 riscritta";

/* ============================================================
   MOTORE — Registro di casa v3
   ------------------------------------------------------------
   UNA SOLA CATENA. Nessuna schermata calcola niente: chiama
   conti() e legge i campi che le servono.

     ancora        = l'ultimo estratto conto registrato
     0a  saldo     = ancora + entrate dopo - uscite dopo
     0b  netto     = 0a - fondo cassa - fantasma - fisse da pagare
     budget        = 0b / giorni che mancano alla prossima paga

   Due regole che tengono in piedi tutto:
   1. tocca il SALDO solo cio' che muove davvero il conto in banca.
      Mettere da parte una quota non muove niente: e' un'etichetta.
   2. ogni evento ha UN effetto solo. Se un evento agisce su due
      catene diverse, i conti si aprono e non si richiudono piu'.

   Puro: niente React, niente DOM. Si prova con node.
   ============================================================ */
/* ════════════════════════════════════════════════════════════
   BLOCCO MOTORE
   Una sola catena. Nessuna schermata calcola niente: chiama
   M.conti(store, oggi) e legge i campi che le servono.
   ════════════════════════════════════════════════════════════ */
var M = (function () {
  "use strict";

  var GIORNO = 86400000;
  var MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno",
    "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];

  /* ---------- date e numeri ---------- */
  function c2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  function iso(t) {
    var d = new Date(t);
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function ts(s) {
    if (typeof s === "number") return s;
    var p = String(s).split("-");
    return new Date(+p[0], +p[1] - 1, +p[2], 0, 0, 0, 0).getTime();
  }
  function oggiTs() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function piuGiorni(t, n) { var d = new Date(t); d.setDate(d.getDate() + n); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function piuMesi(t, n) { var d = new Date(t); d.setMonth(d.getMonth() + n); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function giorniTra(a, b) { return Math.round((ts(b) - ts(a)) / GIORNO); }
  var GG = ["domenica", "luned\u00EC", "marted\u00EC", "mercoled\u00EC", "gioved\u00EC", "venerd\u00EC", "sabato"];
  function lbl(t) { var d = new Date(t); return d.getDate() + " " + MESI[d.getMonth()]; }
  function lblGiorno(t) { return GG[new Date(t).getDay()]; }
  function lblLungo(t) { return lblGiorno(t) + " " + lbl(t); }
  function eur(n) { return c2(n).toFixed(2).replace(".", ","); }
  function id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /* ============================================================
     IL REGISTRO
     ------------------------------------------------------------
     Ogni evento ha una data (d, il giorno a cui si riferisce) e un
     istante (ts, quando l'hai scritto). Per capire se un movimento
     e' prima o dopo un estratto conto conta il giorno; a parita' di
     giorno conta l'ora.

     ENTRATE (alzano il saldo in banca)
       paga      {imp}            lo stipendio
       entrata   {imp, nota}      qualunque altro accredito
     USCITE (abbassano il saldo in banca)
       spesa     {imp, fonte, fissaId, cat, nota}
       fissa     {fissaId, imp}   chiusura di una voce fissa
     NE' L'UNA NE' L'ALTRA (i soldi restano in banca, cambia solo l'etichetta)
       versa     {bustaId, imp}   versamento extra in una busta
       dist      {imp}            dal salvadanaio al budget del mese
       corr      {dove, imp}      correzione a mano del fantasma
       fc        {valore, motivo} nuovo fondo cassa dichiarato
       lettura   {saldo}          l'estratto conto: la nuova ancora
       rinnova   {bustaId, scad}
     ============================================================ */

  var ENTRATE = { paga: 1, entrata: 1 };
  var USCITE = { spesa: 1, fissa: 1 };

  function nuovoStore() {
    return {
      v: 3,
      imp: {
        stip: 0,        // stipendio atteso
        gPaga: 1,       // giorno del mese in cui arriva di solito
        durata: 30,     // giorni del ciclo
        tassa: 0,       // 8a: quanto al massimo metto via ogni giorno
        prevista: null, // data in cui prevedo la prossima paga
        fc: 0,          // 2a: fondo cassa
        avvioFatto: false
      },
      fisse: [],   // 4a  {id,nome,icona,prev,blind,gg}
      buste: [],   // 3a  {id,nome,icona,obiettivo,scad,ric,quota,tipo,attiva}
      ev: [],
      del: [],
      mod: 0
    };
  }

  function ev(store, e) {
    e.id = e.id || id();
    e.ts = e.ts || Date.now();
    e.d = e.d || iso(oggiTs());
    store.ev = store.ev.concat([e]);
    return e;
  }

  // istante di un evento: giorno + ora di scrittura
  function ist(e) { return ts(e.d) * 1000 + ((e.ts || 0) % 1000000); }

  function ordina(lista) {
    return lista.slice().sort(function (a, b) {
      var d = ts(a.d) - ts(b.d);
      return d !== 0 ? d : (a.ts || 0) - (b.ts || 0);
    });
  }

  /* ============================================================
     I CICLI — da una paga all'altra
     ============================================================ */
  function cicli(store) {
    var paghe = ordina(store.ev.filter(function (e) { return e.t === "paga"; }));
    // due paghe lo stesso giorno: la seconda e' un doppione della sincronizzazione
    var buone = [], visto = {};
    paghe.forEach(function (p) {
      var k = p.d + "|" + c2(p.imp);
      if (visto[k]) return;
      visto[k] = 1; buone.push(p);
    });
    var dur = store.imp.durata || 30;
    return buone.map(function (p, i) {
      var ini = ts(p.d);
      var fin = (i + 1 < buone.length) ? piuGiorni(ts(buone[i + 1].d), -1) : piuGiorni(ini, dur - 1);
      return { n: i + 1, ini: ini, fin: fin, stip: c2(p.imp), evId: p.id };
    });
  }

  function cicloDi(lista, quando) {
    for (var i = lista.length - 1; i >= 0; i--) {
      if (quando >= lista[i].ini) return lista[i];
    }
    return null;
  }

  /* ============================================================
     4a — LE VOCI FISSE DEL CICLO
     Regola d'oro: una fissa pesa almeno il previsto, finche' non
     la chiudi. Se la chiudi per meno, la differenza e' risparmio.
     ============================================================ */
  function statoFisse(store, ciclo, quando) {
    if (!ciclo) return [];
    return store.fisse.map(function (f) {
      var chiusure = 0, acconti = 0, chiusa = false;
      store.ev.forEach(function (e) {
        if (e.fissaId !== f.id) return;
        var t = ts(e.d);
        if (t < ciclo.ini || t > ciclo.fin || t > quando) return;
        if (e.t === "fissa") { chiusure += e.imp; chiusa = true; }
        if (e.t === "spesa") acconti += e.imp;
      });
      var uscito = c2(chiusure + acconti);

      // data di addebito, se la voce ne ha una
      var scad = null;
      if (f.gg >= 1 && f.gg <= 31) {
        var d0 = new Date(ciclo.ini);
        var cand = new Date(d0.getFullYear(), d0.getMonth(), f.gg, 0, 0, 0, 0);
        if (cand.getTime() < ciclo.ini) cand = new Date(d0.getFullYear(), d0.getMonth() + 1, f.gg, 0, 0, 0, 0);
        scad = cand.getTime();
      }
      var scaduta = scad != null && scad <= quando;
      // addebito automatico gia' scattato ma non confermato a mano:
      // i soldi dal conto sono usciti lo stesso
      var auto = !chiusa && !!f.blind && scaduta;

      var prev = c2(f.prev);
      return {
        f: f, prev: prev, uscito: uscito, chiusa: chiusa, auto: auto,
        scad: scad, scaduta: scaduta,
        // quanto ha gia' lasciato il conto
        uscitaVera: c2(auto ? Math.max(prev, uscito) : uscito),
        // quanto deve ancora lasciarlo
        daPagare: (chiusa || auto) ? 0 : Math.max(0, c2(prev - uscito)),
        // chiusa sotto il previsto: quello che avanza e' risparmio
        risparmio: chiusa ? Math.max(0, c2(prev - uscito)) : 0,
        sforo: Math.max(0, c2(uscito - prev))
      };
    });
  }

  /* ============================================================
     3a — LE BUSTE (quote) E IL SALVADANAIO
     ============================================================ */
  function tipoBusta(b) { return b.tipo || (b.scad ? "scadenza" : "continua"); }

  function quotaBusta(store, b, quando) {
    if (!b.attiva) return 0;
    var tp = tipoBusta(b);
    if (tp === "mensile" || tp === "continua") return c2(b.quota || 0);
    var sc = scadBusta(store, b, quando);
    if (!sc) return c2(b.quota || 0);
    var gia = accBusta(store, b.id, quando, true);   // senza la quota di questo ciclo
    var manca = Math.max(0, c2((b.obiettivo || 0) - Math.max(0, gia)));
    var mesi = 0, d = new Date(quando);
    while (d.getTime() < sc && mesi < 120) { mesi++; d.setMonth(d.getMonth() + 1); }
    return c2(manca / Math.max(1, mesi));
  }

  function scadBusta(store, b, quando) {
    var sc = b.scad || null;
    ordina(store.ev).forEach(function (e) {
      if (e.t === "rinnova" && e.bustaId === b.id && ts(e.d) <= quando) sc = e.scad;
    });
    return sc;
  }

  // Accantonato di una busta a una certa data. Le quote maturano il
  // giorno della paga: un ciclo iniziato = una quota messa via.
  function accBusta(store, bustaId, quando, escludiCicloCorrente) {
    var b = null;
    store.buste.forEach(function (x) { if (x.id === bustaId) b = x; });
    if (!b) return 0;
    var tot = 0;
    ordina(store.ev).forEach(function (e) {
      if (ts(e.d) > quando) return;
      if (e.t === "accIni" && e.bustaId === bustaId) tot = c2(tot + e.imp);
      if (e.t === "versa" && e.bustaId === bustaId) tot = c2(tot + e.imp);
      if (e.t === "corr" && e.dove === "busta:" + bustaId) tot = c2(tot + e.imp);
      if (e.t === "spesa" && e.fonte === "busta:" + bustaId) tot = c2(tot - e.imp);
    });
    if (escludiCicloCorrente) return c2(tot);
    var lista = cicli(store), corr = cicloDi(lista, quando);
    lista.forEach(function (c) {
      if (c.ini > quando) return;
      if (escludiCicloCorrente && corr && c.ini === corr.ini) return;
      tot = c2(tot + quotaFissata(store, b, c));
    });
    return c2(tot);
  }

  // La quota di una busta per un dato ciclo, calcolata al giorno della paga
  // e poi congelata: cosi' il passato non cambia piu'.
  var _cacheQuota = {};
  function quotaFissata(store, b, ciclo) {
    var k = b.id + "|" + ciclo.ini + "|" + (store.ev.length);
    if (_cacheQuota[k] != null) return _cacheQuota[k];
    var v = quotaBusta(store, b, ciclo.ini);
    _cacheQuota[k] = v;
    return v;
  }

  /* ============================================================
     IL FANTASMA (3a) A UNA DATA
     quote accantonate + risparmio giornaliero + risparmio sulle fisse
     ============================================================ */
  function fantasmaA(store, quando, tassaCiclo, risparmioFisse) {
    var quote = 0;
    store.buste.forEach(function (b) { quote = c2(quote + accBusta(store, b.id, quando)); });

    var salv = 0;
    ordina(store.ev).forEach(function (e) {
      if (ts(e.d) > quando) return;
      if (e.t === "salvIni") salv = c2(salv + e.imp);
      if (e.t === "dist") salv = c2(salv - e.imp);
      if (e.t === "spesa" && e.fonte === "salv") salv = c2(salv - e.imp);
      if (e.t === "corr" && e.dove === "salv") salv = c2(salv + e.imp);
    });

    return {
      quote: c2(quote),
      salvPrima: c2(salv),
      salvOra: c2(tassaCiclo || 0),
      salvFisse: c2(risparmioFisse || 0),
      tot: c2(quote + salv + (tassaCiclo || 0) + (risparmioFisse || 0))
    };
  }

  /* ============================================================
     2a — FONDO CASSA a una data
     ============================================================ */
  function fondoA(store, quando) {
    var fc = store.imp.fc || 0;
    ordina(store.ev).forEach(function (e) {
      if (e.t === "fc" && ts(e.d) <= quando) fc = c2(e.valore);
    });
    return c2(fc);
  }

  /* ============================================================
     0a — IL SALDO PREVISTO
     Ancora sull'ultimo estratto conto, poi solo movimenti veri.
     Lo stipendio e' un'entrata come tutte le altre: se e' arrivato
     dopo la lettura si somma, se e' arrivato prima e' gia' dentro.
     Nessuna ricostruzione, nessuna stima.
     ============================================================ */
  function ultimaLettura(store, quando) {
    var L = null;
    ordina(store.ev).forEach(function (e) {
      if (e.t === "lettura" && ts(e.d) <= quando) L = e;
    });
    return L;
  }

  function saldoA(store, quando) {
    var L = ultimaLettura(store, quando);
    var partenza, da;
    if (L) { partenza = c2(L.saldo); da = ist(L); }
    else {
      // registro senza nessun estratto conto: si parte dal nulla e si
      // somma tutto. Il numero e' attendibile solo se hai inserito
      // davvero ogni movimento dall'inizio.
      partenza = 0; da = -Infinity;
    }
    var movimenti = [];
    ordina(store.ev).forEach(function (e) {
      if (ts(e.d) > quando) return;
      if (ist(e) <= da) return;
      if (ENTRATE[e.t]) movimenti.push({ e: e, seg: 1, imp: c2(e.imp) });
      if (USCITE[e.t]) movimenti.push({ e: e, seg: -1, imp: c2(e.imp) });
    });
    // addebiti automatici scattati dopo la lettura e mai confermati
    var lista = cicli(store), ciclo = cicloDi(lista, quando);
    statoFisse(store, ciclo, quando).forEach(function (r) {
      if (r.auto && r.scad != null && r.scad * 1000 > da) {
        movimenti.push({ e: { t: "auto", d: iso(r.scad), nome: r.f.nome }, seg: -1, imp: r.prev });
      }
    });
    var entrate = 0, uscite = 0;
    movimenti.forEach(function (m) { if (m.seg > 0) entrate = c2(entrate + m.imp); else uscite = c2(uscite + m.imp); });
    return {
      ancora: L, ancoraSaldo: partenza, movimenti: movimenti,
      entrate: entrate, uscite: uscite,
      saldo: c2(partenza + entrate - uscite),
      certo: !!L
    };
  }

  /* ============================================================
     IL PASSO GIORNALIERO — 8a, la tassa di risparmio
     Un giorno alla volta, in avanti. Il budget di oggi nasce da
     quello che resta oggi diviso i giorni che mancano; la tassa
     del giorno e' quello che avanza, fino al massimo che hai deciso.
     Nessun giro vizioso: la tassa di oggi non entra nel budget di oggi.
     ============================================================ */
  function passo(store, ciclo, oggi) {
    if (!ciclo) return { giorni: [], tassa: 0, oggiG: null, giorniTot: 0 };
    var maxTassa = c2(store.imp.tassa || 0);
    var giorniTot = giorniTra(ciclo.ini, ciclo.fin) + 1;
    var ultimo = Math.min(oggi, ciclo.fin);
    var giorni = [], tassa = 0;

    for (var g = ciclo.ini; g <= ultimo; g = piuGiorni(g, 1)) {
      var idx = giorniTra(ciclo.ini, g);
      var rimasti = Math.max(1, giorniTot - idx);

      // quanto ho speso dal budget in questo giorno
      var speso = 0;
      store.ev.forEach(function (e) {
        if (e.t !== "spesa" || e.fissaId) return;
        if (e.fonte && e.fonte !== "budget") return;
        if (ts(e.d) === g) speso = c2(speso + e.imp);
      });

      // Quello che e' mio all'APERTURA del giorno: la spesa di oggi si
      // rimette dentro, altrimenti il budget del giorno si abbasserebbe
      // da solo man mano che spendi e non sapresti mai quanto avevi.
      var s = saldoA(store, g);
      var fisse = statoFisse(store, ciclo, g);
      var daPagare = 0, rispF = 0;
      fisse.forEach(function (r) { daPagare = c2(daPagare + r.daPagare); rispF = c2(rispF + r.risparmio); });
      var fant = fantasmaA(store, g, 0, rispF);
      var base = c2(s.saldo + speso - fondoA(store, g) - fant.tot - daPagare - tassa);

      var budget = c2(base / rimasti);
      var resta = c2(budget - speso);
      var chiuso = g < oggi;
      var tassaG = 0;
      if (chiuso && maxTassa > 0) tassaG = c2(Math.max(0, Math.min(maxTassa, resta)));

      giorni.push({
        ts: g, idx: idx, rimasti: rimasti, base: base, budget: budget,
        speso: speso, resta: resta, tassa: tassaG, chiuso: chiuso,
        pieno: tassaG >= maxTassa - 0.004
      });
      tassa = c2(tassa + tassaG);
    }
    return { giorni: giorni, tassa: tassa, oggiG: giorni[giorni.length - 1] || null, giorniTot: giorniTot };
  }

  /* ============================================================
     5a — LE SPESE VARIABILI, SPEZZATE DAGLI ESTRATTI CONTO
     Ogni tratto va da una lettura alla successiva, col suo totale
     e la somma progressiva a fianco.
     ============================================================ */
  function tratti(store, ciclo, oggi) {
    if (!ciclo) return [];
    var letture = ordina(store.ev).filter(function (e) {
      return e.t === "lettura" && ts(e.d) >= ciclo.ini && ts(e.d) <= Math.min(oggi, ciclo.fin);
    });
    var confini = [{ da: ciclo.ini, ev: null }];
    letture.forEach(function (L) { confini.push({ da: ts(L.d), ev: L }); });

    var out = [], progr = 0;
    for (var i = 0; i < confini.length; i++) {
      var da = confini[i], a = confini[i + 1] || null;
      var tot = 0, voci = [];
      ordina(store.ev).forEach(function (e) {
        if (e.t !== "spesa" && e.t !== "fissa") return;
        if (ts(e.d) > oggi) return;
        var dentro = da.ev ? ist(e) > ist(da.ev) : ts(e.d) >= da.da;
        if (!dentro) return;
        if (a && ist(e) <= ist(a.ev)) { } else if (a) return;
        tot = c2(tot + e.imp);
        voci.push(e);
      });
      progr = c2(progr + tot);
      out.push({
        dal: da.da, al: a ? a.da : oggi,
        apertura: da.ev ? c2(da.ev.saldo) : null,
        chiusura: a ? c2(a.ev.saldo) : null,
        totale: tot, progressivo: progr, voci: voci,
        aperto: !a
      });
    }
    return out;
  }

  /* ============================================================
     CONTI — l'unica funzione che le schermate devono chiamare
     ============================================================ */
  function conti(store, oggi) {
    oggi = oggi || oggiTs();
    _cacheQuota = {};

    var lista = cicli(store);
    var ciclo = cicloDi(lista, oggi);
    var p = passo(store, ciclo, oggi);

    var fisse = statoFisse(store, ciclo, oggi);
    var daPagare = 0, rispFisse = 0, sforo = 0, uscitaFisse = 0;
    fisse.forEach(function (r) {
      daPagare = c2(daPagare + r.daPagare);
      rispFisse = c2(rispFisse + r.risparmio);
      sforo = c2(sforo + r.sforo);
      uscitaFisse = c2(uscitaFisse + r.uscitaVera);
    });

    // 4.1a — le quote di QUESTO mese, gia' dentro ai soldi fantasma
    var quotaMeseTot = 0;
    if (ciclo) store.buste.forEach(function (b) { quotaMeseTot = c2(quotaMeseTot + quotaFissata(store, b, ciclo)); });

    var s = saldoA(store, oggi);                       // 0a
    var fc = fondoA(store, oggi);                      // 2a
    var fant = fantasmaA(store, oggi, p.tassa, rispFisse); // 3a
    var netto = c2(s.saldo - fc - fant.tot - daPagare); // 0b

    var giorniRimasti = ciclo ? Math.max(1, giorniTra(oggi, ciclo.fin) + 1) : 1;
    /* Il budget del giorno si divide per i giorni che mancano alla paga che
       ASPETTI, non per la lunghezza teorica del ciclo. Se la paga slitta, il
       budget si stringe da solo invece di lasciarti scoperto in fondo. */
    var prossima = store.imp.prevista ? ts(store.imp.prevista) : (ciclo ? piuGiorni(ciclo.fin, 1) : null);
    var giorniAttesa = prossima ? Math.max(1, giorniTra(oggi, prossima)) : giorniRimasti;

    /* --- la vista "solo stipendio": niente banca, niente fondo cassa --- */
    var uscitoCiclo = 0;
    if (ciclo) {
      store.ev.forEach(function (e) {
        if (e.t !== "spesa" && e.t !== "fissa") return;
        var t = ts(e.d);
        if (t >= ciclo.ini && t <= oggi) uscitoCiclo = c2(uscitoCiclo + e.imp);
      });
      fisse.forEach(function (r) {
        if (r.auto && r.scad != null && r.scad >= ciclo.ini && r.scad <= oggi)
          uscitoCiclo = c2(uscitoCiclo + r.prev);
      });
    }
    var daFare = c2(daPagare + quotaMeseTot);
    var restaStip = ciclo ? c2(ciclo.stip - uscitoCiclo - daFare) : 0;

    // lo scarto: quello che la banca diceva contro quello che dicevamo noi
    var scarto = null;
    if (s.ancora) {
      var vigilia = saldoA(store, ts(s.ancora.d));
      // il saldo che il registro si aspettava un istante prima della lettura
      var attesoAllora = c2(vigilia.saldo);
      var L2 = ultimaLettura(store, piuGiorni(ts(s.ancora.d), -1));
      if (L2) {
        var m = 0;
        ordina(store.ev).forEach(function (e) {
          if (ist(e) <= ist(L2) || ist(e) >= ist(s.ancora)) return;
          if (ENTRATE[e.t]) m = c2(m + e.imp);
          if (USCITE[e.t]) m = c2(m - e.imp);
        });
        attesoAllora = c2(L2.saldo + m);
        scarto = c2(s.ancora.saldo - attesoAllora);
      }
    }

    var quotaMese = quotaMeseTot;

    var spesoVar = 0;
    store.ev.forEach(function (e) {
      if (e.t !== "spesa" || e.fissaId) return;
      if (e.fonte && e.fonte !== "budget") return;
      if (!ciclo || ts(e.d) < ciclo.ini || ts(e.d) > oggi) return;
      spesoVar = c2(spesoVar + e.imp);
    });

    return {
      oggi: oggi, ciclo: ciclo, cicli: lista,

      /* 0a */ saldo: s.saldo, ancora: s.ancora, ancoraSaldo: s.ancoraSaldo,
      movimenti: s.movimenti, entrateDopo: s.entrate, usciteDopo: s.uscite,
      saldoCerto: s.certo, scarto: scarto,

      /* 1a */ stipendio: ciclo ? ciclo.stip : 0,
      /* 2a */ fondo: fc,
      /* 3a */ fantasma: fant.tot, fantasmaDett: fant,
      /* 4a */ fisse: fisse, fisseDaPagare: daPagare, fisseUscite: uscitaFisse,
      risparmioFisse: rispFisse, sforoFisse: sforo,
      /* 4.1a */ quotaMese: quotaMese,
      /* 5a */ spesoVariabile: spesoVar, tratti: tratti(store, ciclo, oggi),
      /* 6a */ risparmioGg: p.tassa,
      /* 0b */ netto: netto,

      giorni: p.giorni, oggiG: p.oggiG, giorniTot: p.giorniTot,
      giorniRimasti: giorniRimasti, giorniAttesa: giorniAttesa, prossima: prossima,
      alGiorno: c2(netto / giorniRimasti),
      alGiornoAttesa: c2(netto / giorniAttesa),
      /* quello che non e' tuo da spendere */
      intoccabile: c2(fc + fant.tot),
      /* la vista "solo stipendio" */
      uscitoCiclo: uscitoCiclo, daFare: daFare, restaStip: restaStip,
      restaStipAlGiorno: c2(restaStip / giorniAttesa),
      distanzaDalReale: c2(netto - restaStip),

      // la prova del nove: deve fare zero, sempre
      quadratura: c2(s.saldo - (fc + fant.tot + daPagare + netto))
    };
  }

  /* ════════════════════════════════════════════════════════════
     LE CINQUE RISPOSTE
     Sono i fatti che reggono tutto il resto. Ognuna si puo'
     rispondere, e rispondere significa scrivere un evento nel
     registro: non esistono numeri "impostati" da nessuna parte,
     esistono solo fatti datati.
     ════════════════════════════════════════════════════════════ */
  function risposte(store, oggi) {
    oggi = oggi || oggiTs();
    var c = conti(store, oggi);
    var ini = c.ciclo ? c.ciclo.ini : null;
    // che cosa c'era in banca il giorno prima della paga
    var prima = ini ? saldoA(store, piuGiorni(ini, -1)) : null;
    var apertura = null;
    if (ini) {
      ordina(store.ev).forEach(function (e) {
        if (e.t === "lettura" && ts(e.d) < ini) apertura = e;
      });
    }
    return [
      { k: "quando", d: "Quando \u00e8 arrivato lo stipendio?",
        r: ini ? lblLungo(ini) : null, nota: ini ? "oggi \u00e8 il " + (giorniTra(ini, oggi) + 1) + "\u00b0 giorno da allora" : null,
        vuota: !ini, valore: ini ? iso(ini) : "" },
      { k: "quanto", d: "Quanto \u00e8 arrivato?",
        r: c.ciclo ? eur(c.ciclo.stip) : null, vuota: !c.ciclo, valore: c.ciclo ? c.ciclo.stip : store.imp.stip },
      { k: "prima", d: "Quanto c'era gi\u00e0 sul conto prima?",
        r: apertura ? eur(apertura.saldo) : null,
        nota: apertura ? "letto il " + lbl(ts(apertura.d)) : "senza questo dato i conti non possono quadrare",
        vuota: !apertura, valore: apertura ? apertura.saldo : "" },
      { k: "fermi", d: "Quanto non puoi toccare?",
        r: eur(c.intoccabile),
        nota: "fondo cassa " + eur(c.fondo) + " + soldi fantasma " + eur(c.fantasma),
        vuota: false, valore: c.fondo },
      { k: "prossima", d: "Quando arriva il prossimo?",
        r: c.prossima ? lblLungo(c.prossima) : null,
        nota: c.prossima ? (c.giorniAttesa === 0 ? "oggi" : "fra " + c.giorniAttesa + (c.giorniAttesa === 1 ? " giorno" : " giorni")) : null,
        vuota: !c.prossima, valore: c.prossima ? iso(c.prossima) : "" }
    ];
  }

  /* ════════════════════════════════════════════════════════════
     UN PERIODO QUALUNQUE — dal... al...
     ════════════════════════════════════════════════════════════ */
  function periodo(store, da, a) {
    var tDa = ts(da), tA = ts(a);
    if (tDa > tA) return { errore: "invertito" };
    var uscite = 0, entrate = 0, stipendi = 0, voci = [], perCat = {};
    ordina(store.ev).forEach(function (e) {
      var t = ts(e.d);
      if (t < tDa || t > tA) return;
      if (e.t === "spesa" || e.t === "fissa") {
        uscite = c2(uscite + e.imp); voci.push(e);
        var k = e.fissaId || e.t === "fissa" ? "Spese fisse" : (e.cat || "Altro");
        store.fisse.forEach(function (f) { if (f.id === e.fissaId) k = f.nome; });
        perCat[k] = c2((perCat[k] || 0) + e.imp);
      } else if (e.t === "paga") { stipendi = c2(stipendi + e.imp); voci.push(e); }
      else if (ENTRATE[e.t]) { entrate = c2(entrate + e.imp); voci.push(e); }
    });
    var gg = Math.max(1, giorniTra(tDa, tA) + 1);
    return {
      da: tDa, a: tA, giorni: gg, uscite: uscite, entrate: entrate, stipendi: stipendi,
      saldo: c2(entrate + stipendi - uscite), n: voci.length, voci: voci,
      alGiorno: c2(uscite / gg),
      categorie: Object.keys(perCat).map(function (k) { return { nome: k, val: perCat[k] }; })
        .sort(function (x, y) { return y.val - x.val; })
    };
  }

  /* ============================================================
     AZIONI
     ============================================================ */
  function registraPaga(store, imp, d) { return ev(store, { t: "paga", imp: c2(imp), d: d }); }
  function registraEntrata(store, imp, nota, d) { return ev(store, { t: "entrata", imp: c2(imp), nota: nota || "", d: d }); }
  function registraSpesa(store, o) {
    return ev(store, {
      t: "spesa", imp: c2(o.imp), d: o.d, cat: o.cat || null, fissaId: o.fissaId || null,
      fonte: o.fonte || "budget", nota: o.nota || "", chi: o.chi || ""
    });
  }
  function chiudiFissa(store, fissaId, imp, d) { return ev(store, { t: "fissa", fissaId: fissaId, imp: c2(imp), d: d }); }
  function leggiSaldo(store, saldo, d) { return ev(store, { t: "lettura", saldo: c2(saldo), d: d }); }
  function fissaFondoCassa(store, v, motivo, d) { return ev(store, { t: "fc", valore: c2(v), motivo: motivo || "", d: d }); }
  function versaInBusta(store, bustaId, imp, d) { return ev(store, { t: "versa", bustaId: bustaId, imp: c2(imp), d: d }); }
  function distribuisci(store, imp, d) { return ev(store, { t: "dist", imp: c2(imp), d: d }); }
  function correggiFantasma(store, dove, imp, d) { return ev(store, { t: "corr", dove: dove, imp: c2(imp), d: d }); }

  /* Chiudere uno scarto. Tre casi, tre effetti diversi, mai sovrapposti:
       "spesa"    -> era un'uscita che non avevo segnato   (0a scende, 0b scende)
       "entrata"  -> era un accredito che non aspettavo    (0a sale,   0b sale)
       "fantasma" -> l'accantonamento non c'era davvero    (0a fermo,  0b sale)
     Il movimento si data un istante PRIMA della lettura, cosi' lo scarto
     si chiude invece di spostarsi in avanti.                              */
  function chiudiScarto(store, scarto, come, dettaglio) {
    var L = ultimaLettura(store, oggiTs());
    if (!L) return null;
    var quando = { d: L.d, ts: (L.ts || Date.now()) - 1000 };
    if (come === "spesa") return ev(store, { t: "spesa", imp: c2(-scarto), fonte: "budget", cat: "Non segnato", nota: "differenza sull'estratto conto", d: quando.d, ts: quando.ts });
    if (come === "entrata") return ev(store, { t: "entrata", imp: c2(scarto), nota: "differenza sull'estratto conto", d: quando.d, ts: quando.ts });
    if (come === "fantasma") return ev(store, { t: "corr", dove: dettaglio || "salv", imp: c2(scarto), d: quando.d, ts: quando.ts });
    return null;
  }

  /* ============================================================
     MIGRAZIONE DALLA v2 — il registro vecchio si legge tutto
     Le vecchie "rett" avevano un effetto ambiguo: qui diventano
     eventi espliciti, uno per ogni cosa che volevano dire.
     ============================================================ */
  function migra(vecchio) {
    if (!vecchio) return nuovoStore();
    if (vecchio.v === 3) return vecchio;
    var s = nuovoStore();
    s.imp = JSON.parse(JSON.stringify(vecchio.imp || s.imp));
    s.fisse = (vecchio.fisse || []).slice();
    s.buste = (vecchio.buste || []).slice();
    (vecchio.ev || []).forEach(function (e) {
      var x = JSON.parse(JSON.stringify(e));
      if (x.t === "versaExtra") x.t = "versa";
      if (x.t === "rett") {
        if (x.causa === "buste" && x.bustaId) { x.t = "corr"; x.dove = "busta:" + x.bustaId; }
        else if (x.imp < 0) { x.t = "spesa"; x.imp = c2(-x.imp); x.fonte = "budget"; x.cat = "Non segnato"; }
        else { x.t = "entrata"; }
        delete x.causa;
      }
      s.ev.push(x);
    });
    s.mod = Date.now();
    return s;
  }

  return {
    GIORNO: GIORNO, MESI: MESI,
    c2: c2, iso: iso, ts: ts, oggiTs: oggiTs, piuGiorni: piuGiorni, piuMesi: piuMesi,
    giorniTra: giorniTra, lbl: lbl, lblGiorno: lblGiorno, lblLungo: lblLungo, GG: GG, eur: eur, id: id, ist: ist, ordina: ordina,
    nuovoStore: nuovoStore, ev: ev, cicli: cicli, cicloDi: cicloDi,
    statoFisse: statoFisse, tipoBusta: tipoBusta, quotaBusta: quotaBusta,
    scadBusta: scadBusta, accBusta: accBusta, fantasmaA: fantasmaA, fondoA: fondoA,
    ultimaLettura: ultimaLettura, saldoA: saldoA, passo: passo, tratti: tratti,
    conti: conti, risposte: risposte, periodo: periodo,
    registraPaga: registraPaga, registraEntrata: registraEntrata, registraSpesa: registraSpesa,
    chiudiFissa: chiudiFissa, leggiSaldo: leggiSaldo, fissaFondoCassa: fissaFondoCassa,
    versaInBusta: versaInBusta, distribuisci: distribuisci, correggiFantasma: correggiFantasma,
    chiudiScarto: chiudiScarto, migra: migra
  };
})();

/* ════════════════════════════════════════════════════════════
   BLOCCO ARCHIVIO
   Il registro sta nel telefono. Legge anche i formati vecchi e li
   converte, senza cancellarli: se qualcosa non torna, ci sono ancora.
   ════════════════════════════════════════════════════════════ */
var ARCHIVIO = (function () {
  var CHIAVE = "registro-v4";
  var PREC = ["budget-v2", "registro-v3"];

  function carica() {
    try { var g = localStorage.getItem(CHIAVE); if (g) return JSON.parse(g); } catch (e) { }
    return null;
  }
  function trovaVecchio() {
    for (var i = 0; i < PREC.length; i++) {
      try {
        var v = localStorage.getItem(PREC[i]);
        if (v) { var o = JSON.parse(v); if (o && o.ev && o.ev.length) return { chiave: PREC[i], store: o }; }
      } catch (e) { }
    }
    return null;
  }
  function salva(s) { try { localStorage.setItem(CHIAVE, JSON.stringify(s)); return true; } catch (e) { return false; } }
  function esporta(s) {
    var b = new Blob([JSON.stringify(s, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "registro-" + M.iso(M.oggiTs()) + ".json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  return { carica: carica, salva: salva, esporta: esporta, trovaVecchio: trovaVecchio, CHIAVE: CHIAVE };
})();

/* ════════════════════════════════════════════════════════════
   BLOCCO SINCRO
   Due telefoni, un registro. Prima di scrivere si rilegge sempre e
   si fondono i due registri: gli eventi sono immutabili, quindi
   fondere e' solo mettere in fila per id. Nessuno dei due telefoni
   puo' cancellare il lavoro dell'altro.
   ════════════════════════════════════════════════════════════ */
var SINCRO = (function () {
  var API = "https://api.jsonbin.io/v3/b";
  function chiave() { return localStorage.getItem("jb-key") || ""; }
  function bin() { return localStorage.getItem("jb-bin-v4") || ""; }
  function config(k, b) {
    if (k != null) localStorage.setItem("jb-key", k);
    if (b != null) localStorage.setItem("jb-bin-v4", b);
  }
  function stacca() { localStorage.removeItem("jb-bin-v4"); }

  function chiama(met, url, corpo, ok) {
    var x = new XMLHttpRequest();
    x.open(met, url, true);
    x.setRequestHeader("Content-Type", "application/json");
    x.setRequestHeader("X-Master-Key", chiave());
    if (met === "GET") x.setRequestHeader("X-Bin-Meta", "false");
    x.timeout = 12000;
    x.onload = function () {
      if (x.status < 200 || x.status >= 300) return ok(null, x.status);
      try { ok(JSON.parse(x.responseText), 0); } catch (e) { ok(null, -1); }
    };
    x.onerror = function () { ok(null, -2); };
    x.ontimeout = function () { ok(null, -3); };
    x.send(corpo ? JSON.stringify(corpo) : null);
  }

  function unisci(mio, altro) {
    if (!altro || !altro.ev) return mio;
    var out = JSON.parse(JSON.stringify(mio));
    var morti = {};
    (out.del || []).concat(altro.del || []).forEach(function (i) { morti[i] = 1; });
    var visti = {};
    out.ev.forEach(function (e) { visti[e.id] = 1; });
    altro.ev.forEach(function (e) { if (!visti[e.id]) { out.ev.push(e); visti[e.id] = 1; } });
    out.ev = out.ev.filter(function (e) { return !morti[e.id]; });
    out.del = Object.keys(morti);   // niente taglio: una lapide persa fa risorgere un movimento
    if ((altro.mod || 0) > (out.mod || 0)) {
      out.imp = altro.imp; out.fisse = altro.fisse; out.buste = altro.buste; out.mod = altro.mod;
    }
    return out;
  }
  function leggi(ok) {
    if (!bin()) return ok(null, "off");
    chiama("GET", API + "/" + bin() + "/latest", null, function (r, err) {
      if (!r) return ok(null, (err === 401 || err === 404) ? "chiave" : "rete");
      ok(r.record || r, "ok");
    });
  }
  function scrivi(loc, ok) {
    if (!bin()) return ok(loc, "off");
    leggi(function (rem, esito) {
      if (esito !== "ok") return ok(loc, esito);
      var fuso = (rem && rem.ev) ? unisci(loc, rem) : loc;
      chiama("PUT", API + "/" + bin(), fuso, function (r, err) {
        ok(fuso, r ? "ok" : ((err === 401 || err === 404) ? "chiave" : "rete"));
      });
    });
  }
  function crea(loc, ok) {
    chiama("POST", API, loc, function (r) {
      var id = r && r.metadata && r.metadata.id;
      if (id) { config(null, id); ok(id); } else ok(null);
    });
  }
  return { leggi: leggi, scrivi: scrivi, crea: crea, unisci: unisci,
           config: config, chiave: chiave, bin: bin, stacca: stacca };
})();

/* ════════════════════════════════════════════════════════════
   BLOCCO PEZZI — i mattoni dell'interfaccia
   Tutto e' testo HTML: niente framework, niente rete, il file si
   apre anche senza linea.
   ════════════════════════════════════════════════════════════ */
var P = (function () {
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function eur(n, segno) {
    var v = M.c2(n), s = Math.abs(v).toFixed(2).replace(".", ",");
    s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (v < 0 ? "\u2212" : (segno && v > 0 ? "+" : "")) + "\u20AC" + s;
  }
  function eur0(n) {
    var v = Math.round(M.c2(n));
    return "\u20AC" + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (v < 0 ? "\u2212" : "");
  }
  function col(n) { return n < -0.004 ? "ross" : (n > 0.004 ? "verd" : "ten"); }
  function carta(tit, dentro, cls) {
    return '<div class="carta ' + (cls || "") + '">' +
      (tit ? '<div class="eyebrow">' + esc(tit) + "</div>" : "") + dentro + "</div>";
  }
  function riga(et, val, sotto, o) {
    o = o || {};
    return '<div class="riga' + (o.tot ? " tot" : "") + '">' +
      '<div class="et">' + (o.html ? et : esc(et)) + (sotto ? "<small>" + esc(sotto) + "</small>" : "") + "</div>" +
      '<div class="vl ' + (o.cls || "") + '">' + (o.testo != null ? esc(o.testo) : eur(val, o.segno)) + "</div></div>";
  }
  function btn(t, az, o) {
    o = o || {};
    return '<button class="btn ' + (o.cls || "") + '" data-az="' + esc(az) + '"' +
      (o.dato ? ' data-dato="' + esc(o.dato) + '"' : "") + ">" + esc(t) + "</button>";
  }
  function campo(nome, et, val, tipo, extra) {
    return '<label><span class="eyebrow">' + esc(et) + "</span>" +
      '<input name="' + nome + '" type="' + (tipo || "text") + '" value="' + esc(val == null ? "" : val) + '"' +
      (tipo === "number" ? ' inputmode="decimal" step="0.01"' : "") + " " + (extra || "") + "></label>";
  }
  function formula(sx, ris) {
    return '<div class="formula">' + esc(sx) + " = <b>" + esc(ris) + "</b></div>";
  }
  return { esc: esc, eur: eur, eur0: eur0, col: col, carta: carta, riga: riga, btn: btn, campo: campo, formula: formula };
})();
/* ════════════════════════════════════════════════════════════
   BLOCCO DOMANDE
   Il cuore dell'app. Cinque domande, cinque risposte, e ognuna si
   puo' rispondere toccandola. Rispondere significa scrivere un
   evento nel registro: non esiste nessun numero "impostato" da
   qualche parte, esistono solo fatti con una data.
   ════════════════════════════════════════════════════════════ */
function schedaDomande(c, s) {
  var r = M.risposte(s, c.oggi);
  var dom = r.map(function (x) {
    return '<button class="dom" data-az="dom:' + x.k + '">' +
      '<span class="frec">\u203A</span>' +
      '<div class="q">' + P.esc(x.d) + "</div>" +
      '<div class="a' + (x.vuota ? " vuota" : "") + '">' +
      P.esc(x.vuota ? "tocca per rispondere" : x.r) + "</div>" +
      (x.nota ? '<div class="sub">' + P.esc(x.nota) + "</div>" : "") + "</button>";
  }).join("");

  /* --- il riquadro che parte dalla banca --- */
  var quadra = M.c2(c.saldo - c.fondo - c.fantasma - c.fisseDaPagare - c.netto);
  var banca =
    '<div class="riq"><div class="eyebrow">Quindi, per arrivare alla prossima paga</div>' +
    P.riga("Hai in banca adesso", c.saldo) +
    P.riga('Non toccare <small style="color:var(--tenue)">fondo cassa e soldi fantasma</small>',
      -c.intoccabile, null, { cls: "ott", html: true }) +
    P.riga('Fisse ancora da pagare <small style="color:var(--tenue)">devono ancora uscire</small>',
      -c.fisseDaPagare, null, { cls: "ross", html: true }) +
    P.riga("Ti restano", c.netto, null, { tot: true }) +
    P.formula(P.eur0(c.netto) + " \u00F7 " + c.giorniAttesa + (c.giorniAttesa === 1 ? " giorno" : " giorni"),
      P.eur(c.alGiornoAttesa) + " al giorno") +
    (Math.abs(quadra) > 0.02
      ? '<div class="avviso r">Queste righe non chiudono: mancano ' + P.eur(quadra) + ". Segnalamelo.</div>"
      : "") +
    (c.uscitoCiclo > 0.004
      ? '<div class="serif" style="margin-top:9px">In questo ciclo sono gi\u00e0 usciti ' + P.eur(c.uscitoCiclo) +
        ", ma qui non li trovi sottratti: erano gi\u00e0 fuori dal conto quando la banca ti ha dato quel saldo.</div>"
      : "") + "</div>";

  /* --- lo stesso conto guardando solo lo stipendio --- */
  var stip = c.ciclo
    ? '<div class="riq bordo"><div class="eyebrow">Guardando solo lo stipendio</div>' +
      P.riga("Stipendio del " + M.lbl(c.ciclo.ini), c.stipendio) +
      P.riga('Spese gi\u00e0 fatte <small style="color:var(--tenue)">quotidiane e fisse gi\u00e0 uscite</small>',
        -c.uscitoCiclo, null, { cls: "ross", html: true }) +
      P.riga('Spese ancora da fare <small style="color:var(--tenue)">fisse ' + P.eur(c.fisseDaPagare) +
        (c.quotaMese > 0.004 ? " + quote " + P.eur(c.quotaMese) : "") + "</small>",
        -c.daFare, null, { cls: "ross", html: true }) +
      P.riga("Resta dello stipendio", c.restaStip, null, { tot: true }) +
      P.formula(P.eur0(c.restaStip) + " \u00F7 " + c.giorniAttesa + (c.giorniAttesa === 1 ? " giorno" : " giorni"),
        P.eur(c.restaStipAlGiorno) + " al giorno") +
      (Math.abs(c.distanzaDalReale) > 0.02
        ? '<div class="serif" style="margin-top:9px">Guardando la banca invece risultano <b>' + P.eur(c.netto) +
          "</b>, cio\u00e8 <b class=\"" + (c.distanzaDalReale < 0 ? "ross" : "blu") + "\">" +
          P.eur(Math.abs(c.distanzaDalReale)) + (c.distanzaDalReale < 0 ? " in meno" : " in pi\u00f9") +
          "</b>. La differenza sono i soldi che avevi gi\u00e0 da parte prima di questa paga, e le letture che non hanno mai quadrato.</div>"
        : '<div class="serif" style="margin-top:9px">Combacia con quello che dice la banca.</div>') + "</div>"
    : "";

  return P.carta("In parole semplici", dom + banca + stip, "acc");
}

/* ════════════════════════════════════════════════════════════
   BLOCCO PAGINA-OGGI
   ════════════════════════════════════════════════════════════ */
function pagOggi(c, s) {
  if (!c.ciclo) {
    return P.carta(null,
      '<div class="vuota">Il registro parte dalla paga.</div>' +
      P.btn("Registra lo stipendio", "dom:quando"), "acc");
  }
  var g = c.oggiG || { budget: 0, speso: 0, resta: 0 };
  var tassa = M.c2(s.imp.tassa || 0);
  var spendibile = M.c2(g.budget - tassa);
  var resta = M.c2(spendibile - g.speso);
  var h = "";

  h += P.carta(null,
    '<div class="eyebrow">Puoi ancora spendere oggi</div>' +
    '<div class="grande ' + (resta < 0 ? "ross" : "verd") + '">' + P.eur(Math.max(0, resta)) + "</div>" +
    '<div class="serif" style="margin-top:6px">' +
    (resta < 0 ? "sei oltre di " + P.eur(-resta) : "su " + P.eur(spendibile) + " \u00b7 gi\u00e0 spesi " + P.eur(g.speso)) +
    (tassa > 0 ? " \u00b7 " + P.eur(tassa) + " li metti da parte" : "") + "</div>" +
    '<div class="barra"><i style="width:' + Math.min(100, spendibile > 0 ? g.speso / spendibile * 100 : 0) + '%"></i></div>',
    resta < 0 ? "rossa" : "verde");

  h += P.carta("Segna una spesa",
    P.campo("imp", "Quanto", "", "number", 'autocomplete="off"') +
    '<div style="margin-top:8px">' + CATEGORIE.map(function (k) {
      return '<button class="chip' + (App.cat === k[0] ? " on" : "") + '" data-az="cat" data-dato="' + k[0] + '">' +
        k[1] + " " + P.esc(k[0]) + "</button>";
    }).join("") + "</div>" +
    P.campo("nota", "Per cosa (facoltativo)", "", "text", 'autocomplete="off"') +
    P.btn("Registra", "spesa-veloce"));

  h += schedaDomande(c, s);

  /* i giorni del ciclo, uno per uno */
  var ultimi = c.giorni.slice(-12);
  h += P.carta("Gli ultimi giorni",
    '<div style="display:flex;gap:3px;margin-top:9px">' + ultimi.map(function (d) {
      var alt = tassa > 0 ? Math.round(Math.max(0, Math.min(1, d.tassa / tassa)) * 28) : (d.resta >= 0 ? 28 : 0);
      var colore = d.resta < 0 ? "var(--rosso)" : (d.pieno ? "var(--verde)" : "var(--ottone)");
      return '<div style="flex:1;text-align:center">' +
        '<div style="height:30px;background:var(--riga);border-radius:2px;position:relative;overflow:hidden">' +
        '<i style="position:absolute;left:0;right:0;bottom:0;height:' + alt + "px;background:" + colore + '"></i></div>' +
        '<div class="n" style="font-size:9px;color:var(--tenue);margin-top:3px">' + new Date(d.ts).getDate() + "</div></div>";
    }).join("") + "</div>" +
    '<div style="margin-top:11px">' +
    P.riga("Messo da parte in questo ciclo", c.risparmioGg) +
    P.riga("Speso in questo ciclo", c.spesoVariabile) + "</div>");

  return h;
}

/* ════════════════════════════════════════════════════════════
   BLOCCO PAGINA-SPESE
   ════════════════════════════════════════════════════════════ */
var CATEGORIE = [
  ["Alimentari", "\uD83D\uDED2"], ["Casa", "\uD83C\uDFE1"], ["Bimba", "\uD83D\uDC76"],
  ["Trasporti", "\uD83D\uDE97"], ["Salute", "\uD83D\uDC8A"], ["Fuori casa", "\uD83C\uDF7D\uFE0F"],
  ["Svago", "\uD83C\uDF89"], ["Regali", "\uD83C\uDF81"], ["Tecnologia", "\uD83D\uDCBB"],
  ["Vestiti", "\uD83D\uDC55"], ["Imprevisto", "\u26A1"], ["Altro", "\uD83D\uDCE6"]
];
function icona(cat) {
  for (var i = 0; i < CATEGORIE.length; i++) if (CATEGORIE[i][0] === cat) return CATEGORIE[i][1];
  return "\uD83D\uDCE6";
}

function pagSpese(c, s) {
  var oggiIso = M.iso(c.oggi);
  var da = App.pDa || (c.ciclo ? M.iso(c.ciclo.ini) : oggiIso);
  var a = App.pA || oggiIso;
  var p = M.periodo(s, da, a);
  var h = "";

  /* --- il filtro dal... al... --- */
  var scorc = [["Questo ciclo", c.ciclo ? M.iso(c.ciclo.ini) : oggiIso, oggiIso],
               ["Ultimi 7 giorni", M.iso(M.piuGiorni(c.oggi, -6)), oggiIso],
               ["Ultimi 30 giorni", M.iso(M.piuGiorni(c.oggi, -29)), oggiIso],
               ["Tutto", M.iso(M.piuGiorni(c.oggi, -3650)), oggiIso]];
  var corpo =
    '<div style="display:flex;gap:8px;margin-top:8px">' +
    '<div style="flex:1"><span class="eyebrow">dal</span><input name="pda" type="date" value="' + P.esc(da) + '" data-az="periodo"></div>' +
    '<div style="flex:1"><span class="eyebrow">al</span><input name="pa" type="date" value="' + P.esc(a) + '" data-az="periodo"></div></div>' +
    '<div style="margin-top:9px">' + scorc.map(function (x) {
      var on = da === x[1] && a === x[2];
      return '<button class="chip' + (on ? " on" : "") + '" data-az="scorc" data-dato="' + x[1] + "|" + x[2] + '">' + P.esc(x[0]) + "</button>";
    }).join("") + "</div>";

  if (p.errore) {
    corpo += '<div class="avviso r">La data di partenza \u00e8 dopo quella di arrivo.</div>';
  } else {
    corpo += '<div style="text-align:center;padding:14px 0 8px">' +
      '<div class="grande">' + P.eur(p.uscite) + "</div>" +
      '<div class="serif" style="margin-top:4px">' + p.n + (p.n === 1 ? " movimento" : " movimenti") +
      " in " + p.giorni + (p.giorni === 1 ? " giorno" : " giorni") + " \u00b7 " + P.eur(p.alGiorno) + " al giorno</div></div>";
    if (p.entrate > 0.004 || p.stipendi > 0.004) {
      corpo += '<div style="margin-bottom:8px">' +
        (p.stipendi > 0.004 ? P.riga("Stipendi incassati", p.stipendi, null, { cls: "verd", segno: true }) : "") +
        (p.entrate > 0.004 ? P.riga("Altre entrate", p.entrate, null, { cls: "verd", segno: true }) : "") + "</div>";
    }
    var maxV = p.categorie.length ? p.categorie[0].val : 1;
    corpo += p.categorie.slice(0, 9).map(function (x) {
      return '<div style="margin-bottom:9px">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px">' +
        "<span>" + P.esc(x.nome) + "</span>" +
        '<span class="n" style="font-weight:600">' + P.eur(x.val) +
        '<span class="ten" style="font-family:var(--sans);font-size:11px;margin-left:7px">' +
        (p.uscite > 0 ? Math.round(x.val / p.uscite * 100) : 0) + "%</span></span></div>" +
        '<div class="barra"><i style="width:' + (maxV > 0 ? x.val / maxV * 100 : 0) + '%"></i></div></div>';
    }).join("") || '<div class="vuota">Nessuna spesa in questo periodo.</div>';
  }
  h += P.carta("Quanto ho speso dal... al...", corpo);

  /* --- registrare --- */
  h += P.carta("Segna un movimento",
    P.campo("imp", "Quanto", "", "number") +
    '<label><span class="eyebrow">Che cosa</span><select name="tipo">' +
    '<option value="spesa">Spesa di tutti i giorni</option>' +
    '<option value="entrata">Un\'entrata</option>' +
    s.fisse.map(function (f) { return '<option value="fissa:' + f.id + '">Acconto su ' + P.esc(f.nome) + "</option>"; }).join("") +
    "</select></label>" +
    '<label><span class="eyebrow">Con quali soldi</span><select name="fonte">' +
    '<option value="budget">Budget del mese</option><option value="salv">Salvadanaio</option>' +
    s.buste.map(function (b) { return '<option value="busta:' + b.id + '">' + P.esc(b.nome) + "</option>"; }).join("") +
    "</select></label>" +
    P.campo("nota", "Per cosa", "", "text") +
    P.campo("data", "Quando", oggiIso, "date") +
    P.btn("Registra", "movimento"));

  /* --- l'elenco, entrate comprese --- */
  var lista = M.ordina(s.ev).filter(function (e) {
    return (e.t === "spesa" || e.t === "fissa" || e.t === "entrata") && M.ts(e.d) <= c.oggi;
  }).reverse().slice(0, 140);
  if (lista.length) {
    var perG = {}, ord = [];
    lista.forEach(function (e) { if (!perG[e.d]) { perG[e.d] = []; ord.push(e.d); } perG[e.d].push(e); });
    h += P.carta("Movimenti", ord.map(function (d) {
      var tot = perG[d].reduce(function (acc, x) { return acc + (x.t === "entrata" ? -x.imp : x.imp); }, 0);
      return '<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--inchiostro);padding:11px 0 4px;margin-top:6px">' +
        "<b>" + P.esc(M.lblGiorno(M.ts(d)) + " " + M.lbl(M.ts(d))) + "</b>" +
        '<span class="n" style="font-weight:700">' + P.eur(tot) + "</span></div>" +
        perG[d].map(function (e) {
          var f = null; s.fisse.forEach(function (y) { if (y.id === e.fissaId) f = y; });
          var nome = e.t === "entrata" ? "\u2795 " + (e.nota || "Entrata")
            : e.t === "fissa" ? ((f ? f.nome : "Voce fissa") + " \u00b7 chiusa")
            : (f ? f.nome + " \u00b7 acconto" : icona(e.cat) + " " + (e.nota || e.cat || "Spesa"));
          var ora = e.ts ? new Date(e.ts).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) : "";
          var fonte = e.fonte === "salv" ? "dal salvadanaio" : (e.fonte && e.fonte.indexOf("busta:") === 0 ? "da una busta" : "");
          return '<div class="voce"><div class="nm"><b>' + P.esc(nome) + "</b>" +
            "<small>" + P.esc(ora + (fonte ? " \u00b7 " + fonte : "")) + "</small></div>" +
            '<div class="vv ' + (e.t === "entrata" ? "verd" : "") + '">' + P.eur(e.imp, e.t === "entrata") + "</div>" +
            '<button class="x" data-az="cancella" data-dato="' + e.id + '">\u00d7</button></div>';
        }).join("");
    }).join(""));
  }
  return h;
}
/* ════════════════════════════════════════════════════════════
   BLOCCO PAGINA-PIANO — le fisse e le buste
   La quota di una busta non si scrive mai a mano: nasce da quanto
   manca all'obiettivo diviso i mesi che restano. Se sposti una
   scadenza o cambi un importo, la quota si aggiusta da sola.
   ════════════════════════════════════════════════════════════ */
function pagPiano(c, s) {
  var h = "";
  var conData = [], fisse = [], consumo = [];
  c.fisse.forEach(function (r) {
    if (r.f.gg) conData.push(r); else if (r.f.blind) fisse.push(r); else consumo.push(r);
  });
  function bloccoFisse(tit, sub, righe) {
    if (!righe.length) return "";
    return P.carta(tit, '<div class="serif" style="margin:-2px 0 6px">' + P.esc(sub) + "</div>" +
      righe.map(function (r) {
        var stato = r.chiusa ? '<span class="pill verd">chiusa</span>'
          : r.auto ? '<span class="pill ott">gi\u00e0 uscita</span>'
          : '<span class="pill ross">da pagare</span>';
        return '<div class="voce"><div class="nm"><b>' + P.esc(r.f.nome) + " " + stato + "</b>" +
          "<small>previsto " + P.eur(r.prev) +
          (r.uscito > 0.004 ? " \u00b7 usciti " + P.eur(r.uscito) : "") +
          (r.scad ? " \u00b7 addebito il " + new Date(r.scad).getDate() : "") + "</small></div>" +
          '<div class="vv ' + (r.daPagare > 0.004 ? "ross" : "ten") + '">' + P.eur(r.daPagare) + "</div>" +
          (!r.chiusa && !r.auto ? '<button class="btn picc vuoto" style="width:auto;margin:0;padding:5px 9px" ' +
            'data-az="dlg:chiudi-fissa" data-dato="' + r.f.id + '">chiudi</button>' : "") + "</div>";
      }).join(""));
  }
  h += P.carta("Il peso del mese",
    '<div class="grande">' + P.eur(M.c2(c.fisseUscite + c.fisseDaPagare + c.quotaMese)) + "</div>" +
    '<div class="serif" style="margin-top:5px">' + P.eur(M.c2(c.fisseUscite + c.fisseDaPagare)) +
    " di spese fisse + " + P.eur(c.quotaMese) + " di quote</div>" +
    '<div style="margin-top:10px">' +
    P.riga("Gi\u00e0 uscite dal conto", c.fisseUscite, null, { cls: "ten" }) +
    P.riga("Devono ancora uscire", c.fisseDaPagare, null, { cls: "ott" }) +
    P.riga("Risparmiato sulle bollette chiuse", c.risparmioFisse, null, { cls: "verd" }) + "</div>", "acc");

  h += bloccoFisse("Con data certa", "rate e abbonamenti: escono da soli", conData);
  h += bloccoFisse("Importo fisso", "sempre uguali, senza data", fisse);
  h += bloccoFisse("A consumo", "bollette e carburante: previsione da confermare", consumo);
  h += P.carta(null, P.btn("Aggiungi una voce fissa", "dlg:nuova-fissa", { cls: "vuoto picc" }));

  h += P.carta("Buste \u00b7 spese che arrivano ogni tanto",
    (s.buste.length ? s.buste.map(function (b) {
      var gia = M.accBusta(s, b.id, c.oggi);
      var quota = M.quotaBusta(s, b, c.oggi);
      var sc = M.scadBusta(s, b, c.oggi);
      var mesi = 0;
      if (sc) { var d = new Date(c.oggi); while (d.getTime() < sc && mesi < 120) { mesi++; d.setMonth(d.getMonth() + 1); } }
      var manca = b.obiettivo ? M.c2(b.obiettivo - gia) : 0;
      return '<div style="padding:11px 0;border-bottom:1px solid var(--riga)">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline">' +
        "<b>" + P.esc(b.nome) + "</b>" +
        '<span class="n ott" style="font-weight:700">' + P.eur(gia) +
        (b.obiettivo ? '<span class="ten" style="font-family:var(--sans);font-size:11px"> su ' + P.eur(b.obiettivo) + "</span>" : "") +
        "</span></div>" +
        (b.obiettivo ? '<div class="barra"><i style="width:' + Math.min(100, gia / b.obiettivo * 100) + '%;background:var(--ottone)"></i></div>' : "") +
        '<div class="serif" style="margin-top:5px">' +
        (sc ? "obiettivo " + P.eur(b.obiettivo) + " \u2212 " + P.eur(gia) + " gi\u00e0 da parte = " +
          P.eur(manca) + " in " + mesi + (mesi === 1 ? " mese" : " mesi") + " = <b>" + P.eur(quota) + " al mese</b>"
          : "fondo continuo \u00b7 " + P.eur(quota) + " al mese") + "</div>" +
        (manca > 0.004 && mesi === 0 ? '<div class="avviso r">Scadenza raggiunta e mancano ' + P.eur(manca) + ".</div>" : "") +
        '<div class="duo" style="margin-top:6px">' +
        P.btn("Ho pagato", "dlg:paga-busta", { cls: "vuoto picc", dato: b.id }) +
        P.btn("Correggi", "dlg:busta", { cls: "vuoto picc", dato: b.id }) + "</div></div>";
    }).join("") : '<div class="vuota">Nessuna busta.</div>') +
    P.btn("Aggiungi una busta", "dlg:nuova-busta", { cls: "vuoto picc" }), "ottone");

  h += P.carta("Il salvadanaio",
    '<div class="medio verd">' + P.eur(M.c2(c.fantasma - c.fantasmaDett.quote)) + "</div>" +
    '<div style="margin-top:9px">' +
    P.riga("Dai mesi scorsi", c.fantasmaDett.salvPrima) +
    P.riga("Messo via in questo ciclo", c.fantasmaDett.salvOra,
      P.eur(s.imp.tassa || 0) + " al giorno, quando avanzano") +
    P.riga("Risparmiato sulle fisse", c.fantasmaDett.salvFisse) + "</div>" +
    '<div class="duo">' + P.btn("Riporta nel budget", "dlg:dist", { cls: "vuoto picc" }) +
    P.btn("Correggi", "dlg:corr-salv", { cls: "vuoto picc" }) + "</div>", "verde");
  return h;
}

/* ════════════════════════════════════════════════════════════
   BLOCCO PAGINA-CONTO
   Tutto discende dall'ultimo estratto conto. Se la banca dice un
   numero diverso, la differenza e' una cosa vera e va detta: o e'
   una spesa sfuggita, o un'entrata che non sapevi.
   ════════════════════════════════════════════════════════════ */
function pagConto(c, s) {
  var h = "";
  var mv = c.movimenti.slice(-10).map(function (m) {
    var nome = m.e.nota || m.e.cat || ({ paga: "Stipendio", entrata: "Entrata", auto: m.e.nome, fissa: "Voce fissa" }[m.e.t]) || "Spesa";
    return '<div style="display:flex;gap:9px;padding:5px 0;border-bottom:1px dotted var(--riga);font-size:12.5px">' +
      '<span class="n ten" style="width:52px;flex:none">' + P.esc(M.lbl(M.ts(m.e.d))) + "</span>" +
      '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + P.esc(nome) + "</span>" +
      '<span class="n ' + (m.seg < 0 ? "ross" : "verd") + '" style="font-weight:600">' + P.eur(m.seg * m.imp, true) + "</span></div>";
  }).join("");

  h += P.carta(null,
    '<div class="eyebrow">' + (c.ancora ? "Letti " + P.eur(c.ancoraSaldo) + " il " + M.lbl(M.ts(c.ancora.d)) : "Nessun estratto conto") + "</div>" +
    '<div class="grande" style="margin-top:5px">' + P.eur(c.saldo) + "</div>" +
    '<div class="serif" style="margin-top:5px">\u00e8 quello che devi leggere in banca adesso</div>' +
    (mv ? '<div style="margin-top:11px">' + mv + "</div>" : "") +
    (!c.saldoCerto ? '<div class="avviso o">Non hai ancora registrato nessun estratto conto, quindi questo numero \u00e8 solo la somma di quello che hai inserito.</div>' : ""),
    "acc");

  h += P.carta("Di chi sono quei soldi",
    P.riga("Fondo cassa", -c.fondo, "la cifra che hai deciso di non toccare", { cls: "ott" }) +
    P.riga("Accantonati nelle buste", -c.fantasmaDett.quote, null, { cls: "ott" }) +
    P.riga("Salvadanaio", -M.c2(c.fantasma - c.fantasmaDett.quote), null, { cls: "ott" }) +
    P.riga("Fisse ancora da pagare", -c.fisseDaPagare, null, { cls: "ross" }) +
    P.riga("Tuoi da spendere fino alla paga", c.netto, null, { tot: true }) +
    '<div class="avviso o">Non scendere sotto ' + P.eur(c.intoccabile) +
    ". \u00c8 il fondo cassa pi\u00f9 tutto quello che ci hai messo sopra e non hai ancora usato.</div>", "acc");

  h += P.carta("Aggiorna la lettura",
    '<div class="serif">Guarda il saldo in banca adesso e scrivilo qui. Da questo momento conteranno solo i movimenti registrati dopo.</div>' +
    P.campo("saldo", "Saldo che leggi", "", "number") +
    P.campo("data", "Quando", M.iso(c.oggi), "date") +
    P.btn("Registra la lettura", "lettura"));

  if (c.scarto !== null && Math.abs(c.scarto) > 0.004) {
    h += P.carta("La differenza dell'ultima lettura",
      P.riga("Il registro si aspettava", M.c2(c.ancora.saldo - c.scarto)) +
      P.riga("La banca diceva", c.ancora.saldo) +
      P.riga(c.scarto > 0 ? "Ci sono in pi\u00f9" : "Ne mancano", Math.abs(c.scarto), null, { tot: true, cls: P.col(c.scarto) }) +
      '<div class="serif" style="margin-top:8px">Dimmi da dove viene, cos\u00ec il registro torna a dire la verit\u00e0:</div>' +
      (c.scarto < 0
        ? P.btn("Erano spese che non avevo segnato", "scarto:spesa", { cls: "rossa picc" })
        : P.btn("Erano soldi entrati che non sapevo", "scarto:entrata", { cls: "verde picc" })) +
      P.btn("Erano soldi del fondo cassa \u00b7 riparti da qui", "scarto:fondo", { cls: "ottone picc" }), "rossa");
  } else if (c.ancora) {
    h += P.carta(null, '<div class="riga"><div class="et"><b>I conti tornano.</b>' +
      "<small>l'ultima lettura combacia con il registro</small></div>" +
      '<div class="vl verd">\u2713</div></div>', "verde");
  }

  if (c.tratti.length) {
    h += P.carta("Speso fra un estratto conto e l'altro", c.tratti.map(function (t) {
      return '<div class="voce"><div class="nm"><b>' + P.esc(M.lbl(t.dal) + " \u2192 " + (t.aperto ? "oggi" : M.lbl(t.al))) + "</b>" +
        "<small>" + (t.aperto ? "tratto ancora aperto" : "chiuso dalla lettura di " + P.eur(t.chiusura)) + "</small></div>" +
        '<div class="vv">' + P.eur(t.totale) + '<small class="ten" style="display:block;font-size:10px">progr. ' + P.eur(t.progressivo) + "</small></div></div>";
    }).join(""));
  }
  return h;
}

/* ════════════════════════════════════════════════════════════
   BLOCCO PAGINA-ALTRO
   ════════════════════════════════════════════════════════════ */
function pagAltro(c, s) {
  var h = "";
  h += P.carta("Impostazioni",
    P.campo("stip", "Stipendio atteso", s.imp.stip, "number") +
    P.campo("durata", "Giorni del ciclo", s.imp.durata, "number") +
    P.campo("tassa", "Risparmio al giorno", s.imp.tassa, "number") +
    '<div class="serif" style="margin-top:5px">Ogni sera, se nel budget del giorno resta almeno questa cifra, finisce nel salvadanaio. Non serve premere nulla.</div>' +

  var b = SINCRO.bin();
  h += P.carta("Due telefoni",

    P.btn("Sincronizza adesso", "sincro-ora", { cls: "picc" }) +
    (b ? P.btn("Stacca questo telefono", "sincro-stacca", { cls: "vuoto picc" }) : ""));

  h += P.carta("Il registro",
    '<div class="serif">' + s.ev.length + " movimenti registrati. Nessun totale \u00e8 salvato: se cancelli un movimento, tutti i numeri si ricalcolano da soli.</div>" +
    '<div style="margin-top:9px">' +
    P.riga("Quadratura", M.c2(c.saldo - c.fondo - c.fantasma - c.fisseDaPagare - c.netto),
      "deve fare zero", { cls: Math.abs(M.c2(c.saldo - c.fondo - c.fantasma - c.fisseDaPagare - c.netto)) > 0.02 ? "ross" : "verd" }) +
    P.riga("Ultima lettura", 0, null, { testo: c.ancora ? M.lbl(M.ts(c.ancora.d)) : "mai" }) +
    P.riga("Cicli registrati", 0, null, { testo: String(c.cicli.length) }) + "</div>" +
    P.btn("Scarica una copia", "esporta", { cls: "vuoto picc" }) +
    P.btn("Carica un registro", "dlg:importa", { cls: "vuoto picc" }) +
    '<div class="n ten" style="margin-top:11px;padding-top:9px;border-top:1px solid var(--riga);font-size:11px">versione ' + P.esc(VERSIONE) + "</div>");
  return h;
}

var FINESTRE = {

        ") pi\u00f9 i soldi fantasma (" + P.eur(c.fantasma) + ").\n\nI soldi fantasma sono quote e risparmi: si vedono sull'estratto conto ma non sono tuoi da spendere. Si modificano dalla pagina Piano.",
      corpo: P.campo("fc", "Fondo cassa", c.fondo, "number") +
        P.campo("motivo", "Perch\u00e9 lo cambi (facoltativo)", "", "text") +
        '<div class="serif" style="margin-top:7px">Cambiarlo non muove un euro in banca: sposta solo il confine fra quello che ti sei promesso di non toccare e quello che puoi spendere.</div>',
      ok: "Fissa il fondo cassa", az: "fai:fondo" };

  "prossima": function (c, s) {

      corpo: P.campo("prevista", "Data prevista", s.imp.prevista || (c.prossima ? M.iso(c.prossima) : ""), "date"),
      ok: "Salva", az: "fai:prossima" };
  },

  /* --- le altre --- */
  "chiudi-fissa": function (c, s, dato) {

      corpo: P.campo("imp", "Importo uscito", f.prev, "number") + P.campo("data", "Quando", M.iso(c.oggi), "date"),
      ok: "Chiudi la voce", az: "fai:chiudi-fissa", dato: dato };
  },
  "nuova-fissa": function () {

      testo: "Rate e abbonamenti hanno un importo certo e una data. Bollette e carburante no: metti la previsione, poi la chiudi con la cifra vera.",
      corpo: P.campo("nome", "Nome", "", "text") + P.campo("prev", "Previsione al mese", "", "number") +
        P.campo("gg", "Giorno di addebito (se ce l'ha)", "", "number") +
        '<label><span class="eyebrow">Tipo</span><select name="blind">' +
        '<option value="1">Esce da sola, importo fisso</option>' +
        '<option value="0">A consumo, la chiudo io</option></select></label>',
      ok: "Aggiungi", az: "fai:nuova-fissa" };

  "nuova-busta": function () {
    return { tit: "Nuova busta",
      testo: "Metti quanto devi pagare e quando. La quota al mese la calcola l'app: quello che manca diviso i mesi che restano.",
      corpo: P.campo("nome", "Nome", "", "text") + P.campo("obiettivo", "Quanto devi pagare", "", "number") +
        P.campo("scad", "Entro quando", "", "date") + P.campo("acc", "Quanto hai gi\u00e0 da parte", "0", "number"),
      ok: "Aggiungi", az: "fai:nuova-busta" };
  },
  "busta": function (c, s, dato) {
    var b = null; s.buste.forEach(function (x) { if (x.id === dato) b = x; });

    var gia = M.accBusta(s, b.id, c.oggi);

        P.campo("vero", "Quanto c'\u00e8 davvero (correggi)", gia, "number") +
        P.campo("versa", "Oppure versa dell'altro adesso", "", "number"),
      ok: "Applica", az: "fai:busta", dato: dato };

  "paga-busta": function (c, s, dato) {
